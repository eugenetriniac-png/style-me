    if (o.turtle) {
      var roll = P()
        .M(cx - t.neckHalf - 16, t.shoulderY + 24)
        .C(cx - t.neckHalf - 10, t.shoulderY - 44, cx + t.neckHalf + 10, t.shoulderY - 44, cx + t.neckHalf + 16, t.shoulderY + 24)
        .C(cx + t.neckHalf, t.shoulderY + 48, cx - t.neckHalf, t.shoulderY + 48, cx - t.neckHalf - 16, t.shoulderY + 24)
        .Z().d();
      out += ribBand(g, roll);
      out += seamLine(P().M(cx - t.neckHalf - 12, t.shoulderY - 4).C(cx - 30, t.shoulderY - 26, cx + 30, t.shoulderY - 26, cx + t.neckHalf + 12, t.shoulderY - 4).d(), edgeColour(g.item));
    } else {
      var neckOuter = P()
        .M(cx - t.neckHalf - 12, nd - 10)
        .C(cx - t.neckHalf, nd + 28, cx + t.neckHalf, nd + 28, cx + t.neckHalf + 12, nd - 10)
        .C(cx + t.neckHalf, nd + 6, cx - t.neckHalf, nd + 6, cx - t.neckHalf - 12, nd - 10)
        .Z().d();
      out += inside(g, neckOuter);
      out += ribBand(g, P()
        .M(cx - t.neckHalf - 16, nd - 14)
        .C(cx - t.neckHalf - 4, nd + 22, cx + t.neckHalf + 4, nd + 22, cx + t.neckHalf + 16, nd - 14)
        .C(cx + t.neckHalf + 6, nd - 30, cx - t.neckHalf - 6, nd - 30, cx - t.neckHalf - 16, nd - 14)
        .Z().d());

    out += ribBand(g, P()
      .M(cx - t.hemHalf, t.hemY - 54)

      .C(cx + t.hemHalf, t.hemY - 6, cx + t.hemHalf - 2, t.hemY + 4, cx + t.hemHalf - 4, t.hemY + 6)
      .C(cx + 60, t.hemY + 20, cx - 60, t.hemY + 20, cx - t.hemHalf + 4, t.hemY + 6)
      .Z().d());
    return out;
  }

  /* ---------- open jackets -------------------------------------- */
  function openJacket(g, cfg) {
    var o = g.item.opts || {};
    var cx = 320, shoulderY = 104;

    var hemY = cfg.hemY, hemHalf = cfg.hemHalf || chestHalf + 4;
    var gap = cfg.gap || 16;
    var th = thread(g.item);
    var out = groundShadow(g, cx + 12, hemY + 40, hemHalf + 34, 28);

    var back = P()
      .M(cx - shoulderHalf + 22, shoulderY + 10)
      .C(cx - chestHalf + 18, 260, cx - hemHalf + 20, hemY - 160, cx - hemHalf + 22, hemY - 10)

    var t = { cx: cx, shoulderY: shoulderY, shoulderHalf: shoulderHalf, chestHalf: chestHalf };
    out += cloth(g, sleevePath(t, -1, { long: true }));
    out += cloth(g, sleevePath(t, 1, { long: true }));

    [-1, 1].forEach(function (side) {
      var panel = P()
        .M(cx + side * shoulderHalf, shoulderY)
        .C(cx + side * (shoulderHalf + 6), shoulderY + 60, cx + side * chestHalf, 220, cx + side * chestHalf, 280)
        .C(cx + side * (chestHalf + 2), 360, cx + side * hemHalf, hemY - 150, cx + side * hemHalf, hemY - 14)
        .C(cx + side * hemHalf * 0.6, hemY + 10, cx + side * gap * 2, hemY + 10, cx + side * gap, hemY - 6)
        .L(cx + side * gap, shoulderY + (cfg.lapel || 60))

      out += cloth(g, panel);
      out += '<g clip-path="url(#' + g.paint.clip(panel) + ')">' +
        fold(P().M(cx + side * (chestHalf - 30), 240).C(cx + side * 96, 360, cx + side * 104, hemY - 150, cx + side * 88, hemY - 30).d(), shade(g.item.colour, -0.5), 9) +
        '</g>';
      out += stitch(P().M(cx + side * (gap + 9), shoulderY + (cfg.lapel || 60) + 10).L(cx + side * (gap + 9), hemY - 20).d(), th, '7 6', 1.8);
    });

    if (cfg.lapel) {
      [-1, 1].forEach(function (side) {
        var lap = P()
          .M(cx + side * (cfg.collarHalf || 54), shoulderY + 6)
          .L(cx + side * gap, shoulderY + cfg.lapel)
          .L(cx + side * (gap + 54), shoulderY + cfg.lapel - 34)
          .L(cx + side * ((cfg.collarHalf || 54) + 16), shoulderY + 34)
          .Z().d();
        out += cloth(g, lap, { colour: shade(g.item.colour, 0.07) });
        out += stitch(P().M(cx + side * (gap + 6), shoulderY + cfg.lapel - 6).L(cx + side * (gap + 46), shoulderY + cfg.lapel - 32).d(), th, '5 4', 1.6);
      });
      out += cloth(g, P()
        .M(cx - (cfg.collarHalf || 54) - 6, shoulderY + 8)

        .C(cx + 30, shoulderY + 24, cx - 30, shoulderY + 24, cx - (cfg.collarHalf || 54) - 6, shoulderY + 8)
        .Z().d(), { colour: shade(g.item.colour, 0.04) });

      var col = P()
        .M(cx - ch - 10, shoulderY + 12)
        .C(cx - 40, shoulderY - 30, cx + 40, shoulderY - 30, cx + ch + 10, shoulderY + 12)
        .C(cx + 40, shoulderY + 34, cx - 40, shoulderY + 34, cx - ch - 10, shoulderY + 12)
        .Z().d();
      out += cloth(g, col, { colour: shade(g.item.colour, 0.05) });
      out += stitch(P().M(cx - ch, shoulderY + 18).C(cx - 30, shoulderY + 30, cx + 30, shoulderY + 30, cx + ch, shoulderY + 18).d(), th, '5 4', 1.6);
    }

        out += button(cx + gap + 22, shoulderY + (cfg.lapel || 70) + 40 + i * cfg.buttonGap, 10, bc);
      }

    if (cfg.pockets === 'welt') {
      [-1, 1].forEach(function (side) {
        var y = hemY - 170;
        out += cloth(g, P().M(cx + side * 60, y).L(cx + side * 150, y - 8).L(cx + side * 152, y + 22).L(cx + side * 62, y + 30).Z().d(),
          { colour: shade(g.item.colour, -0.1) });

        var y = 250;
        out += cloth(g, P().M(cx + side * 54, y).L(cx + side * 132, y - 6).L(cx + side * 134, y + 40).L(cx + side * 56, y + 46).Z().d(),
          { colour: shade(g.item.colour, -0.06) });
        out += stitch(P().M(cx + side * 58, y + 38).L(cx + side * 130, y + 32).d(), th, '5 4', 1.6);

        if (o.rivets) {

  function dress(g) {
    var o = g.item.opts || {};

    if (!o.strap) {
      out += cloth(g, sleevePath(t, -1, { long: o.long }));

    var body = P()
      .M(cx - t.shoulderHalf, t.shoulderY)
      .C(cx - 158, 260, cx - 128, 380, cx - 126, 440)
      .C(cx - 150, 560, cx - 200, 700, cx - t.hemHalf, t.hemY - 30)
      .C(cx - 100, t.hemY + 24, cx + 100, t.hemY + 24, cx + t.hemHalf, t.hemY - 30)
      .C(cx + 200, 700, cx + 150, 560, cx + 126, 440)
      .C(cx + 128, 380, cx + 158, 260, cx + t.shoulderHalf, t.shoulderY)
      .C(cx + t.shoulderHalf - 20, t.shoulderY + 20, cx + t.neckHalf, t.shoulderY + t.neckDrop - 10, cx, t.shoulderY + t.neckDrop)
      .C(cx - t.neckHalf, t.shoulderY + t.neckDrop - 10, cx - t.shoulderHalf + 20, t.shoulderY + 20, cx - t.shoulderHalf, t.shoulderY)
      .Z().d();

      inner += highlight(P().M(cx + i * 26 + 14, 320).C(cx + i * 40 + 18, 500, cx + i * 54 + 22, 680, cx + i * 62 + 24, t.hemY - 30).d(), light, 12, 0.16);

      [-1, 1].forEach(function (side) {
        out += cloth(g, P().M(cx + side * 44, t.shoulderY + t.neckDrop - 6).L(cx + side * 96, t.shoulderY - 40)
          .L(cx + side * 110, t.shoulderY - 34).L(cx + side * 58, t.shoulderY + t.neckDrop + 2).Z().d());
      });
    }
    return out;
  }

  /* ============================================================

  var GROUND = 330;

  function outsole(g, colour, toeX, heelX, top, opts) {
    opts = opts || {};

      .M(toeX - 6, top)

    var s = '<path d="' + mid + '" fill="' + g.paint.cylinder(colour) + '"/>' +
      SM.materials.overlay(mid, 'leather', 0.45) +
      '<path d="' + mid + '" fill="none" stroke="' + shade(colour, -0.35) + '" stroke-width="1.6" opacity=".7"/>' +
      '<path d="' + P().M(toeX - 12, GROUND - 20).C(toeX + 60, GROUND + 4, heelX - 60, GROUND + 6, heelX + 12, GROUND - 22).d() +
      '" fill="none" stroke="' + shade(colour, -0.6) + '" stroke-width="14" stroke-linecap="round" opacity=".9"/>';
    if (opts.airUnit) {
      s += '<ellipse cx="' + (heelX - 66) + '" cy="' + (GROUND - 26) + '" rx="46" ry="16" fill="' + shade(colour, -0.22) + '" opacity=".5"/>';

  function sneaker(g) {
    var o = g.item.opts || {};
    var sole = o.sole || '#F2EFE7';
    var toeX = 86, heelX = 606, midTop = 286;

    out += '<g clip-path="url(#' + g.paint.clip(upper) + ')">' +
      seamLine(P().M(250, 190).C(240, 226, 244, 258, 256, midTop).d(), shade(g.item.colour, -0.5)) +
      seamLine(P().M(360, 168).C(348, 208, 352, 248, 364, midTop).d(), shade(g.item.colour, -0.5)) +

    out += inside(g, P().M(500, 126).C(546, 118, 584, 142, 596, 186)
      .C(566, 168, 528, 160, 500, 164).Z().d());
    out += cloth(g, P().M(556, 130).C(592, 148, 612, 190, 614, 240)
      .C(596, 206, 572, 176, 546, 158).Z().d(), { colour: shade(g.item.colour, -0.14) });

    /* Tongue rising out of the throat. */
    out += cloth(g, P().M(392, 152).C(414, 116, 460, 100, 502, 106)
      .C(500, 138, 474, 158, 434, 172).Z().d(), { colour: shade(g.item.colour, 0.07) });

    /* Side panel — the graphic that makes a sneaker recognisable. */
    var accent = o.accent || shade(g.item.colour, lum(g.item.colour) > 0.5 ? -0.5 : 0.4);
    out += '<path d="' + P().M(190, midTop - 12).C(268, 254, 350, 216, 432, 170)

        '" fill="none" stroke="' + lace + '" stroke-width="7" stroke-linecap="round"/>';
      out += '<circle cx="' + (lx + 1) + '" cy="' + (ly + 12) + '" r="3.6" fill="' + shade(g.item.colour, -0.5) + '"/>';
      out += '<circle cx="' + (lx + 40) + '" cy="' + (ly - 6) + '" r="3.6" fill="' + shade(g.item.colour, -0.5) + '"/>';
    }

    out += outsole(g, sole, toeX, heelX, midTop, { airUnit: o.airUnit });
    return out;

/* ============================================================
   STYLE ME — fit.js

   same skeleton the body uses, so a piece follows the pose, the
   build and the height rather than being pasted on top.

   The result is grouped into five independent layers:

       bottom · top · shoes · outer · accessory

          .C(cxS2 + side * (sk.neckHalf + 20), sk.neckBase + 10, cxS2 + side * (sk.neckHalf + 20), sk.neckBase + 24, cxS2 + side * 12, nd + 30)
          .L(cxS2 + side * 3, nd + 4).Z().d(), { colour: shade(item.colour, 0.05) });
      });
      out += '<path d="' + P().M(sk.cx + sk.shoulderOff, nd + 20).L(sk.cx + sk.waistOff, hemY - 8).d() +
        '" fill="none" stroke="' + edgeOf(item) + '" stroke-opacity=".5" stroke-width="1.6"/>';
    }
    return out;
  }

  function renderOuter(sk, item, paint) {
    var shape = item.shape;
    var longCoat = shape === 'coat' || shape === 'trench';
    var ease = shape === 'puffer' ? 20 : longCoat ? 15 : 12;
    var hemY = longCoat ? sk.kneeY + 40 : shape === 'blazer' || shape === 'cardigan' ? sk.hipY + 46 : sk.hipY + 16;
    var out = '';

    out += piece(paint, item, sleeveShell(sk, sk.arms.left, true, ease), { colour: shade(item.colour, -0.1) });
    out += piece(paint, item, sleeveShell(sk, sk.arms.right, true, ease));

    /* Back panel between the open fronts. */
    var shell = torsoShell(sk, { ease: ease, hemY: hemY, neckDrop: 6, neckHalf: sk.neckHalf + 12 });
    out += '<path d="' + shell + '" fill="' + shade(item.colour, -0.55) + '"/>';

    var cxS = sk.cx + sk.shoulderOff;
    var gap = shape === 'puffer' ? 5 : 9;
    var clipId = paint.clip(shell);
    [-1, 1].forEach(function (side) {
      var front = P()
        .M(cxS + side * (sk.shoulderHalf + ease), sk.shoulderY)
        .L(cxS + side * (sk.hipHalf + ease + 14), hemY + 20)
        .L(cxS + side * gap, hemY + 20)
        .L(cxS + side * gap, sk.neckBase + (shape === 'blazer' || longCoat ? 70 : 14))
        .L(cxS + side * (sk.neckHalf + 14), sk.neckBase + 2)
        .Z().d();
      out += '<g clip-path="url(#' + clipId + ')">' +
        piece(paint, item, front, {
          creases: crease(P().M(cxS + side * (sk.bustHalf + ease - 16), sk.bustY + 30)
            .C(cxS + side * 60, sk.waistY, cxS + side * 66, sk.waistY + 80, cxS + side * 54, hemY - 20).d(), item, 8)
        }) + '</g>';
    });

    /* Collar or lapels. */
    if (shape === 'blazer' || longCoat) {
      [-1, 1].forEach(function (side) {
        out += piece(paint, item, P()
          .M(cxS + side * (sk.neckHalf + 14), sk.neckBase + 2)
          .L(cxS + side * gap, sk.neckBase + 70)
          .L(cxS + side * (gap + 30), sk.neckBase + 52)
          .L(cxS + side * (sk.neckHalf + 26), sk.neckBase + 14)
          .Z().d(), { colour: shade(item.colour, 0.08) });
      });
    }
    out += piece(paint, item, P()
      .M(cxS - sk.neckHalf - 16, sk.neckBase + 6)
      .C(cxS - 14, sk.neckBase - 20, cxS + 14, sk.neckBase - 20, cxS + sk.neckHalf + 16, sk.neckBase + 6)
      .C(cxS + 12, sk.neckBase + 22, cxS - 12, sk.neckBase + 22, cxS - sk.neckHalf - 16, sk.neckBase + 6)
      .Z().d(), { colour: shade(item.colour, 0.04) });

    if (shape === 'puffer') {
      var inner = '';
      for (var y = sk.shoulderY + 40; y < hemY - 10; y += 46) {
        inner += crease(P().M(cxS - sk.bustHalf - ease - 6, y).C(cxS - 30, y + 8, cxS + 30, y + 8, cxS + sk.bustHalf + ease + 6, y).d(), item, 8, 1.6);
      }
      out += '<g clip-path="url(#' + clipId + ')">' + inner + '</g>';
    }
    return out;
  }

  function renderBottom(sk, item, paint) {
    var o = item.opts || {};
    var shape = item.shape;
    if (shape === 'skirt') return renderSkirt(sk, item, paint);

    var shorts = shape === 'shorts';
    var wide = (o.hemHalf || 100) > 120;
    var ease = wide ? 22 : shape === 'joggers' ? 12 : 10;
    var hemY = shorts ? sk.crotchY + (sk.kneeY - sk.crotchY) * 0.55 : sk.ankleY + 6;
    var out = '';

    ['left', 'right'].forEach(function (key) {
      var leg = sk.legs[key];
      var far = key === 'left';
      var ankle = { x: leg.ankle.x, y: hemY };
      var wHip = sk.thighHalf + ease;
      var wKnee = sk.kneeHalf + ease * (wide ? 1.5 : 1);
      var wHem = shorts ? sk.kneeHalf + ease * 1.4
        : (shape === 'joggers' ? sk.ankleHalf + 8 : sk.ankleHalf + ease * (wide ? 2.4 : 1.4));
      var d = limbPath(leg.hip, shorts ? lerp(leg.hip, leg.knee, 0.6) : leg.knee, ankle, wHip, wKnee, wHem);
      out += piece(paint, item, d, {
        colour: far ? shade(item.colour, -0.08) : item.colour,
        creases:
          crease(P().M(leg.knee.x - wKnee + 6, leg.knee.y - 60).C(leg.knee.x - 10, leg.knee.y, leg.knee.x - 6, leg.knee.y + 70, ankle.x - wHem + 8, hemY - 14).d(), item, 7) +
          crease(P().M(leg.knee.x + wKnee - 8, leg.knee.y - 90).C(leg.knee.x + 16, leg.knee.y - 10, leg.knee.x + 12, leg.knee.y + 60, ankle.x + wHem - 10, hemY - 16).d(), item, 6, 0.8) +
          sheen(P().M(leg.hip.x - 6, leg.hip.y + 30).C(leg.knee.x - 4, leg.knee.y - 40, leg.knee.x - 2, leg.knee.y + 60, ankle.x, hemY - 20).d(), item, 16)
      });
      if (o.cuff) {
        out += piece(paint, item, P().M(ankle.x - wHem, hemY - 26).L(ankle.x + wHem, hemY - 26)
          .L(ankle.x + wHem - 1, hemY).L(ankle.x - wHem + 1, hemY).Z().d(),
          { colour: shade(item.colour, -0.12) });
      }
    });

    var seatTop = sk.hipY - (shape === 'joggers' ? 34 : 42);
    out += piece(paint, item, seatShell(sk, ease, seatTop), {
      creases: crease(P().M(sk.cx + sk.hipOff + 6, seatTop + 20).C(sk.cx + sk.hipOff + 12, sk.hipY, sk.cx + sk.hipOff + 8, sk.crotchY - 20, sk.cx + sk.hipOff + 4, sk.crotchY + 6).d(), item, 6, 0.8)
    });
    /* Waistband */
    out += piece(paint, item, P()
      .M(sk.cx + sk.hipOff - sk.hipHalf - ease + 2, seatTop)
      .C(sk.cx + sk.hipOff - 30, seatTop - 12, sk.cx + sk.hipOff + 30, seatTop - 12, sk.cx + sk.hipOff + sk.hipHalf + ease - 2, seatTop)
      .L(sk.cx + sk.hipOff + sk.hipHalf + ease - 2, seatTop + 22)
      .C(sk.cx + sk.hipOff + 30, seatTop + 12, sk.cx + sk.hipOff - 30, seatTop + 12, sk.cx + sk.hipOff - sk.hipHalf - ease + 2, seatTop + 22)
      .Z().d(), { colour: shade(item.colour, 0.06) });
    return out;
  }

  function renderSkirt(sk, item, paint) {
    var o = item.opts || {};
    var mini = (o.hemY || 660) < 520;
    var hemY = mini ? sk.crotchY + (sk.kneeY - sk.crotchY) * 0.45 : sk.kneeY + 30;
    var cxH = sk.cx + sk.hipOff;
    var top = sk.hipY - 46;
    var hi = sk.hipHalf + 12;
    var flare = mini ? 14 : 46;
    var d = P()
      .M(cxH - hi, top)
      .C(cxH - hi - 6, sk.hipY + 20, cxH - hi - flare * 0.5, hemY - 90, cxH - hi - flare, hemY - 12)
      .C(cxH - hi * 0.5, hemY + 16, cxH + hi * 0.5, hemY + 16, cxH + hi + flare, hemY - 12)
      .C(cxH + hi + flare * 0.5, hemY - 90, cxH + hi + 6, sk.hipY + 20, cxH + hi, top)
      .C(cxH + hi * 0.5, top - 12, cxH - hi * 0.5, top - 12, cxH - hi, top)
      .Z().d();
    var inner = '';
    for (var i = -3; i <= 3; i++) {
      inner += crease(P().M(cxH + i * 18, top + 20).C(cxH + i * 26, sk.hipY + 60, cxH + i * 32, hemY - 80, cxH + i * 38, hemY - 6).d(), item, 7, o.pleated ? 1.4 : 0.8);
    }
    return piece(paint, item, d, { creases: inner });
  }

  function renderDress(sk, item, paint) {
    var o = item.opts || {};
    var hemY = sk.kneeY + 28;
    var body = torsoShell(sk, {
      ease: 12, hemY: hemY, hemHalf: sk.hipHalf + 54,
      neckDrop: o.strap ? 34 : 14,
      neckHalf: o.strap ? sk.neckHalf + 22 : sk.neckHalf + 8,
      fitted: true
    });
    var inner = '';
    for (var i = -3; i <= 3; i++) {
      inner += crease(P().M(sk.cx + i * 16, sk.waistY).C(sk.cx + i * 26, sk.hipY + 40, sk.cx + i * 34, hemY - 90, sk.cx + i * 42, hemY - 10).d(), item, 8, 0.9) +
        sheen(P().M(sk.cx + i * 16 + 8, sk.waistY + 20).C(sk.cx + i * 26 + 10, sk.hipY + 40, sk.cx + i * 34 + 12, hemY - 90, sk.cx + i * 42 + 14, hemY - 20).d(), item, 10);
    }
    var out = '';
    if (!o.strap) {
      out += piece(paint, item, sleeveShell(sk, sk.arms.left, o.long, 11), { colour: shade(item.colour, -0.08) });
      out += piece(paint, item, sleeveShell(sk, sk.arms.right, o.long, 11));
    }
    out += piece(paint, item, body, { creases: inner });
    if (o.strap) {
      var cxS = sk.cx + sk.shoulderOff;
      [-1, 1].forEach(function (side) {
        out += piece(paint, item, P().M(cxS + side * 22, sk.neckBase + 44).L(cxS + side * (sk.shoulderHalf - 16), sk.shoulderY - 2)
          .L(cxS + side * (sk.shoulderHalf - 6), sk.shoulderY + 4).L(cxS + side * 30, sk.neckBase + 48).Z().d());
      });
    }
    return out;
  }

  function renderShoes(sk, item, paint) {
    var o = item.opts || {};
    var shape = item.shape;
    var out = '';
    ['left', 'right'].forEach(function (key) {
      var leg = sk.legs[key];
      var far = key === 'left';
      var sign = key === 'right' ? 1 : -1;
      var x = leg.ankle.x + sign * 3;
      var w = sk.ankleHalf + 9;
      var sole = sk.soleY;
      var colour = far ? shade(item.colour, -0.1) : item.colour;

      if (shape === 'boot') {
        var shaftTop = o.tall ? sk.kneeY + 40 : sk.ankleY - 66;
        out += piece(paint, item, P()
          .M(x - w - 2, shaftTop)
          .C(x - w - 5, sk.ankleY, x - w - 6, sole - 16, x - w + 2, sole - 2)
          .L(x + w + sign * 16, sole - 2)
          .C(x + w + 6, sole - 22, x + w + 4, sk.ankleY, x + w + 2, shaftTop)
          .C(x + w * 0.4, shaftTop - 10, x - w * 0.4, shaftTop - 10, x - w - 2, shaftTop)
          .Z().d(), {
            colour: colour,
            creases: crease(P().M(x - w + 4, shaftTop + 20).C(x - 4, sk.ankleY - 20, x - 2, sk.ankleY + 10, x + 2, sole - 12).d(), item, 6)
          });
        out += '<path d="' + P().M(x - w - 4, sole - 12).L(x + w + sign * 18, sole - 12).L(x + w + sign * 18, sole).L(x - w - 4, sole).Z().d() +
          '" fill="' + shade(item.colour, -0.6) + '"/>';
      } else {
        var top = sk.ankleY + (shape === 'sandal' ? 12 : 2);
        out += piece(paint, item, P()
          .M(x - w, top)
          .C(x - w - 4, top + 22, x - w - 3, sole - 12, x - w + 3, sole - 8)
          .L(x + w + sign * 20, sole - 6)
          .C(x + w + sign * 22, sole - 20, x + w + 3, top + 16, x + w, top)
          .C(x + w * 0.4, top - 8, x - w * 0.4, top - 8, x - w, top)
          .Z().d(), { colour: colour });
        /* Sole unit */
        var soleColour = o.sole || shade(item.colour, -0.5);
        out += '<path d="' + P().M(x - w - 3, sole - 10).L(x + w + sign * 22, sole - 8)
          .C(x + w + sign * 24, sole + 2, x - w - 2, sole + 2, x - w - 3, sole - 10).Z().d() +
          '" fill="' + paint.cylinder(soleColour) + '"/>';
        if (shape === 'heel') {
          out += '<path d="' + P().M(x - w + 4, sole - 10).L(x - w + 12, sole - 10).L(x - w + 10, sole + 30).L(x - w + 2, sole + 30).Z().d() +
            '" fill="' + shade(item.colour, -0.2) + '"/>';
        }
        if (shape === 'sneaker') {
          out += '<path d="' + P().M(x - w + 2, top + 14).C(x - 2, top + 6, x + 4, top + 6, x + w - 2, top + 16).d() +
            '" fill="none" stroke="' + (o.lace || '#EFEAE0') + '" stroke-width="4" stroke-linecap="round"/>';
        }
      }
    });
    return out;
  }

  function renderAccessory(sk, item, paint) {
    var shape = item.shape;
    var cxS = sk.cx + sk.shoulderOff;
    var cy = sk.headCy, rx = sk.headRx, ry = sk.headRy;

    if (shape === 'cap') {
      var capY = cy - ry + 10;
      return piece(paint, item, P().M(cxS - rx - 3, capY + 16)
        .C(cxS - rx - 5, capY - 34, cxS + rx + 5, capY - 34, cxS + rx + 3, capY + 16)
        .C(cxS + rx * 0.5, capY + 24, cxS - rx * 0.5, capY + 24, cxS - rx - 3, capY + 16).Z().d()) +
        piece(paint, item, P().M(cxS - rx - 2, capY + 14).C(cxS - rx - 30, capY + 20, cxS - rx - 34, capY + 30, cxS - rx - 30, capY + 34)
          .C(cxS - rx - 4, capY + 30, cxS - rx + 4, capY + 26, cxS - rx + 2, capY + 20).Z().d(),
          { colour: shade(item.colour, -0.14) });
    }
    if (shape === 'beanie') {
      var bY = cy - ry + 12;
      return piece(paint, item, P().M(cxS - rx - 4, bY + 22)
        .C(cxS - rx - 6, bY - 38, cxS + rx + 6, bY - 38, cxS + rx + 4, bY + 22)
        .C(cxS + rx * 0.5, bY + 30, cxS - rx * 0.5, bY + 30, cxS - rx - 4, bY + 22).Z().d()) +
        '<rect x="' + (cxS - rx - 5) + '" y="' + (bY + 12) + '" width="' + (rx * 2 + 10) + '" height="18" rx="6" fill="' +
        paint.cylinder(shade(item.colour, -0.12)) + '"/>';
    }
    if (shape === 'sunglasses') {
      var eyeY = cy + ry * 0.06;
      var lensW = rx * 0.4, lensH = rx * 0.26;
      var s = '';
      [-1, 1].forEach(function (side) {
        var ex = cxS + side * rx * 0.42;
        s += '<rect x="' + (ex - lensW) + '" y="' + (eyeY - lensH) + '" width="' + (lensW * 2) + '" height="' + (lensH * 2) +
          '" rx="' + (lensH * 0.5) + '" fill="' + item.colour + '" opacity=".9"/>';
      });
      s += '<path d="M' + (cxS - 6) + ' ' + (eyeY - 2) + ' L' + (cxS + 6) + ' ' + (eyeY - 2) +
        '" stroke="' + item.colour + '" stroke-width="4"/>';
      return s;
    }
    if (shape === 'scarf') {
      var d = P().M(cxS - sk.neckHalf - 18, sk.neckBase - 4)
        .C(cxS - sk.neckHalf - 26, sk.neckBase + 40, cxS + sk.neckHalf + 26, sk.neckBase + 40, cxS + sk.neckHalf + 18, sk.neckBase - 4)
        .C(cxS + 14, sk.neckBase + 14, cxS - 14, sk.neckBase + 14, cxS - sk.neckHalf - 18, sk.neckBase - 4)
        .Z().d();
      var tail = P().M(cxS - 16, sk.neckBase + 22).L(cxS - 30, sk.bustY + 130).L(cxS - 2, sk.bustY + 134).L(cxS + 4, sk.neckBase + 24).Z().d();
      return piece(paint, item, d) + piece(paint, item, tail, { colour: shade(item.colour, -0.08) });
    }
    if (shape === 'belt') {
      var cxH = sk.cx + sk.hipOff;
      return '<rect x="' + (cxH - sk.hipHalf - 6) + '" y="' + (sk.hipY - 52) + '" width="' + (sk.hipHalf * 2 + 12) +
        '" height="16" rx="3" fill="' + paint.cylinder(item.colour) + '" stroke="' + edgeOf(item) + '" stroke-width="1.4"/>' +
        '<rect x="' + (cxH - 11) + '" y="' + (sk.hipY - 56) + '" width="22" height="24" rx="4" fill="#BFAE8E"/>';
    }
    /* bags */
    var bx = sk.cx + sk.hipOff + sk.hipHalf + 34;
    var by = sk.hipY + 26;
    var strap = P().M(sk.arms.right.shoulder.x + 8, sk.shoulderY + 6)
      .C(bx + 16, sk.bustY + 90, bx + 4, by - 70, bx - 2, by - 6).d();
    return '<path d="' + strap + '" fill="none" stroke="' + paint.cylinder(shade(item.colour, -0.2)) + '" stroke-width="9" stroke-linecap="round"/>' +
      piece(paint, item, P().M(bx - 34, by).L(bx + 34, by).C(bx + 38, by + 44, bx + 34, by + 76, bx + 30, by + 88)
        .C(bx, by + 96, bx - 30, by + 96, bx - 30, by + 88).C(bx - 34, by + 76, bx - 38, by + 44, bx - 34, by).Z().d(),
        { gloss: item.material === 'leather' });
  }

  /* ============================================================
     Assembly
     ============================================================ */
  function layerOf(item) {
    if (item.category === 'dress') return 'top';
    if (item.category === 'top') return 'top';
    if (item.category === 'outer') return 'outer';
    if (item.category === 'bottom') return 'bottom';
    if (item.category === 'shoes') return 'shoes';
    if (item.shape === 'belt') return 'bottom';
    return 'accessory';
  }
  SM.fitLayerOf = layerOf;

  function drawItem(sk, item, paint) {
    if (!item) return '';
    if (item.category === 'dress') return renderDress(sk, item, paint);
    if (item.category === 'top') return renderTop(sk, item, paint);
    if (item.category === 'outer') return renderOuter(sk, item, paint);
    if (item.category === 'bottom') return renderBottom(sk, item, paint);
    if (item.category === 'shoes') return renderShoes(sk, item, paint);
    return renderAccessory(sk, item, paint);
  }

  function group(outfit) {
    var by = { bottom: [], top: [], shoes: [], outer: [], accessory: [] };
    (outfit.items || []).forEach(function (it) {
      if (!it) return;
      by[layerOf(it)].push(it);
    });
    /* Scarves sit above a coat collar; hats above everything. */
    var order = { scarf: 1, bagShoulder: 2, bagTote: 3, cap: 4, beanie: 5, sunglasses: 6 };
    by.accessory.sort(function (a, b) { return (order[a.shape] || 9) - (order[b.shape] || 9); });
    return by;
  }
  SM.fitGroup = group;

  SM.fit = {
    layers: LAYERS,

    render: function (outfit, look) {
      limbPath = SM.figure.limbPath;
      look = look || {};
      var paint = SM.newPaint();
      var sk = SM.figure.skeleton(look);
      var by = group(outfit);

      /* Hide the plain base layer wherever a garment already covers
         the body, so briefs never show through a pair of trousers. */
      look = Object.assign({}, look, {
        hideBriefs: by.bottom.some(function (i) { return i.category === 'bottom'; }) ||
          by.top.some(function (i) { return i.category === 'dress'; }),
        hideBand: by.top.length > 0
      });

      var body =
        SM.figure.groundShadow(sk, paint) +
        SM.figure.hairBack(sk, look, paint) +
        SM.figure.body(sk, look, paint) +
        SM.figure.head(sk, look, paint) +
        SM.figure.hairFront(sk, look, paint);

      var layers = LAYERS.map(function (name) {
        return '<g class="fit-layer" data-layer="' + name + '">' +
          by[name].map(function (it) { return drawItem(sk, it, paint); }).join('') + '</g>';
      }).join('');

      return '<svg class="worn" viewBox="' + SM.FIGURE_VIEWBOX + '" preserveAspectRatio="xMidYMax meet" ' +
        'role="img" aria-label="Outfit worn by a model">' +
        '<defs>' + SM.materials.defs() + '</defs>' +
        body + layers + paint.markup() + '</svg>';
    },

    /* Rewrite one layer in place. The other four groups keep the
       exact nodes they already had. */
    updateLayer: function (svgEl, outfit, look, layerName) {
      if (!svgEl) return;
      limbPath = SM.figure.limbPath;
      var paint = SM.newPaint();
      var sk = SM.figure.skeleton(look || {});
      var by = group(outfit);
      var g = svgEl.querySelector('[data-layer="' + layerName + '"]');
      if (!g) return;
      g.innerHTML = (by[layerName] || []).map(function (it) { return drawItem(sk, it, paint); }).join('');
      /* Newly created gradients need to reach the document. */
      var defs = svgEl.querySelector('defs');
      if (defs) defs.insertAdjacentHTML('beforeend', paint.markup().replace(/^<defs>|<\/defs>$/g, ''));
      g.classList.remove('layer-swap');
      void g.getBoundingClientRect();
      g.classList.add('layer-swap');
    }
  };
})(window.SM);

</script>
<script>
/* ============================================================
   STYLE ME — profile.js

   The entry quiz. Deliberately almost nothing about clothes: how
   you wake up, what your flat looks like, what you notice in
   people. Those predict taste far better than asking someone what
   they think their style is.

   Every answer pushes one to three of the ten style axes.
   ============================================================ */

window.SM = window.SM || {};

(function (SM) {
  'use strict';

  SM.QUESTIONS = [
    {
      id: 'q1', kicker: 'Mornings',
      q: 'Your alarm goes off. What happens?',
      options: [
        { t: 'I’m already up', w: { classic: 3, minimal: 2, sporty: 1 } },
        { t: 'Snooze ×4, then panic', w: { street: 3, sporty: 2 } },
        { t: 'I stay in bed with my phone', w: { romantic: 2, retro: 2, colour: 1 } },
        { t: 'I don’t use an alarm', w: { avantGarde: 3, edgy: 2 } }
      ]
    },
    {
      id: 'q2', kicker: 'Home',
      q: 'Your flat, seen from the front door:',
      options: [
        { t: 'White walls, three objects, a lot of space', w: { minimal: 4, avantGarde: 1 } },
        { t: 'Plants everywhere, wood, rugs', w: { romantic: 2, utility: 2, retro: 1 } },
        { t: 'Posters, records, a bit of mess', w: { retro: 3, street: 2, colour: 1 } },
        { t: 'Everything second hand, nothing matches', w: { avantGarde: 3, colour: 2, retro: 1 } }
      ]
    },
    {
      id: 'q3', kicker: 'Sound',
      q: 'What’s on repeat right now?',
      options: [
        { t: 'Rap and drill', w: { street: 4, sporty: 1 } },
        { t: 'Guitars, loud ones', w: { edgy: 3, retro: 2 } },
        { t: 'Minimal electronic, ambient', w: { minimal: 3, avantGarde: 2 } },
        { t: 'Pop, disco, eighties', w: { colour: 3, retro: 3 } },
        { t: 'Jazz, classical, film scores', w: { classic: 3, romantic: 2 } }
      ]

    outfit.items.forEach(function (i) { i.tags.forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
    var dominant = Object.keys(counts).sort(function (a, b) {
      return (counts[b] * 10 + (axes[b] || 0)) - (counts[a] * 10 + (axes[a] || 0));
    })[0] || 'minimal';

    var r = rng(outfit.id);
    var pool = OPENERS[dominant] || OPENERS.minimal;
    var lines = [pool[Math.floor(r() * pool.length)]];

    var key = outfit.items.filter(function (i) { return i.category === 'outer' || i.category === 'dress'; })[0] || outfit.items[0];
    var shoes = outfit.items.filter(function (i) { return i.category === 'shoes'; })[0];
    var materials = {};
    outfit.items.forEach(function (i) { materials[SM.MATERIALS[i.material] || i.material] = 1; });
    var mats = Object.keys(materials).slice(0, 3);

    if (key) lines.push('It starts with the ' + key.name.toLowerCase() + ' from ' + key.brand + '.');
    if (mats.length > 1) lines.push('The mix of ' + mats.join(', ').toLowerCase() + ' keeps it from reading as a uniform.');
    if (shoes) lines.push('The ' + shoes.name.toLowerCase() + ' closes the silhouette without weighing it down.');
    var top = SM.topAxes(axes, 1)[0];
    if (top && SM.AXES[top]) {
      lines.push('Picked because your profile leans ' + SM.AXES[top].label.toLowerCase() + ': ' + SM.AXES[top].note + '.');
    }
    return lines.join(' ');
  }

  AI.describe = function (outfit, profile) {
    if (!AI.available()) return Promise.resolve(localCopy(outfit, profile));
    var prompt = 'You are a stylist. In three sentences at most, explain why this outfit works for this ' +
      'person. Be concrete, never flattering.\n\nOutfit: ' +
      outfit.items.map(function (i) {
        return i.name + ' (' + i.brand + ', ' + i.colourName + ', ' + i.material + ')';
      }).join(' · ') +
      '\nProfile: ' + SM.topAxes(profile.axes, 3).map(function (k) { return SM.AXES[k].label; }).join(', ');
    return fetch(AI.endpoint, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': AI.apiKey },
      body: JSON.stringify({ model: AI.model, max_tokens: 300, messages: [{ role: 'user', content: prompt }] })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var text = j && j.content && j.content[0] && j.content[0].text;
        return text || localCopy(outfit, profile);
      })
      .catch(function () { return localCopy(outfit, profile); });
  };

  var MOMENTS = ['for a Tuesday', 'for dinner with no dress code', 'for a day that overruns',
    'for an opening', 'for walking a long way', 'for something that matters',
    'for a slow Sunday', 'for a Friday night'];

  AI.title = function (outfit, profile) {
    var r = rng('t' + outfit.id);
    var arch = SM.archetype((profile && profile.axes) || {});
    return arch.name + ' ' + MOMENTS[Math.floor(r() * MOMENTS.length)];
  };

  SM.ai = AI;
})(window.SM);

</script>
<script>
/* ============================================================
   STYLE ME — store.js
   Application state and local persistence. No account, no server:
   everything lives in this browser.
   ============================================================ */

window.SM = window.SM || {};

(function (SM) {
  'use strict';

  var KEY = 'style-me/v2';
  var fallback = null;          // used when localStorage is blocked

  function readRaw() {
    try { return window.localStorage.getItem(KEY); } catch (e) { return fallback; }
  }
  function writeRaw(v) {
    try { window.localStorage.setItem(KEY, v); } catch (e) { fallback = v; }
  }

  function defaults() {
    return {
      version: 2,
      onboarded: false,
      profile: {
        axes: null,
        answers: {},
        seed: 'sm' + Math.floor(Math.random() * 100000),
        rev: 0
      },
      me: {
        name: 'You',
        handle: 'you',
        age: null,
        heightCm: 172,
        weightKg: null,
        skin: '#E3B48D',
        hairColour: '#2E1F16',
        hairStyle: 'short',
        build: 0.42,
        height: 0.5,
        frame: 0.45,
        photos: { face: null, front: null, side: null, back: null },
        useMe: false
      },
      likes: {},
      savedOutfits: [],
      savedItems: [],
      filters: SM.emptyFilters(),
      following: ['p5'],
      myPosts: [],
      postLikes: {},
      comments: {},
      threads: null,
      bag: []
    };
  }

  var state = null;

  SM.store = {
    get: function () {
      if (!state) {
        var raw = readRaw();
        try { state = raw ? Object.assign(defaults(), JSON.parse(raw)) : defaults(); }
        catch (e) { state = defaults(); }
        if (!state.filters) state.filters = SM.emptyFilters();
        if (!state.threads) state.threads = SM.store.seedThreads();
      }
      return state;
    },

    save: function () {
      if (!state) return;
      try { writeRaw(JSON.stringify(state)); }
      catch (e) {
        /* Quota is usually the uploaded photos. Keep the face, drop
           the rest rather than losing everything else. */
        var lean = JSON.parse(JSON.stringify(state));
        lean.me.photos = { face: lean.me.photos.face, front: null, side: null, back: null };
        try { writeRaw(JSON.stringify(lean)); } catch (e2) { /* give up quietly */ }
      }
    },

    reset: function () {
      state = defaults();
      state.threads = SM.store.seedThreads();
      SM.store.save();
    },

    seedThreads: function () {
      return SM.THREAD_SEEDS.map(function (t) {
        return {
          personId: t.person,
          messages: t.messages.slice(),
          unread: t.messages.filter(function (m) { return !m.me; }).length
        };
      });
    },

    profile: function () {
      var s = SM.store.get();
      if (!s.profile.axes) s.profile.axes = SM.scoreQuiz({});
      return s.profile;
    },

    /* ---------- who wears the clothes ---------- */
    myLook: function () {
      var m = SM.store.get().me;
      return {
        skin: m.skin, hairColour: m.hairColour, hairStyle: m.hairStyle,
        build: m.build, height: m.height, frame: m.frame, photo: m.photos.face
      };
    },

    /* Models vary per outfit so the feed doesn't show the same
       body twenty times — but always the same one for a given
       outfit, so it never shuffles under you. */
    lookFor: function (outfit) {
      if (SM.store.get().me.useMe) return SM.store.myLook();
      var r = SM.rng('model' + outfit.id);
      var skins = SM.SKIN_TONES;
      var hairs = SM.HAIR_COLOURS;
      var styles = SM.HAIR_STYLES;
      return {
        skin: skins[Math.floor(r() * skins.length)].hex,
        hairColour: hairs[Math.floor(r() * hairs.length)].hex,
        hairStyle: styles[Math.floor(r() * styles.length)],
        build: 0.24 + r() * 0.5,
        height: 0.3 + r() * 0.5,
        frame: 0.2 + r() * 0.68
      };
    },

    /* ---------- likes & saves ---------- */
    isLiked: function (id) { return !!SM.store.get().likes[id]; },
    toggleLike: function (outfit) {
      var s = SM.store.get();
      var on = !s.likes[outfit.id];
      if (on) s.likes[outfit.id] = Date.now(); else delete s.likes[outfit.id];
      SM.stylist.learn(s.profile, outfit, on ? 1 : -1);
      SM.store.save();
      return on;
    },
    isSaved: function (id) { return SM.store.get().savedOutfits.indexOf(id) !== -1; },
    toggleSave: function (id) {
      var s = SM.store.get();
      var i = s.savedOutfits.indexOf(id);
      if (i === -1) s.savedOutfits.unshift(id); else s.savedOutfits.splice(i, 1);
      SM.store.save();
      return i === -1;
    },
    isItemSaved: function (id) { return SM.store.get().savedItems.indexOf(id) !== -1; },
    toggleItemSave: function (id) {
      var s = SM.store.get();
      var i = s.savedItems.indexOf(id);
      if (i === -1) s.savedItems.unshift(id); else s.savedItems.splice(i, 1);
      SM.store.save();
      return i === -1;
    },

    /* ---------- bag ---------- */
    bagCount: function () { return SM.store.get().bag.length; },
    inBag: function (id) {
      return SM.store.get().bag.some(function (b) { return b.id === id; });
    },
    addToBag: function (id, size) {
      var s = SM.store.get();
      if (!SM.store.inBag(id)) s.bag.push({ id: id, size: size || null });
      SM.store.save();
    },
    removeFromBag: function (id) {
      var s = SM.store.get();
      s.bag = s.bag.filter(function (b) { return b.id !== id; });
      SM.store.save();
    },
    bagTotal: function () {
      return SM.store.get().bag.reduce(function (a, b) {
        var it = SM.CATALOG.byId[b.id];
        return a + (it ? it.price : 0);
      }, 0);
    },

    /* ---------- community ---------- */
    isFollowing: function (id) { return SM.store.get().following.indexOf(id) !== -1; },
    toggleFollow: function (id) {
      var s = SM.store.get();
      var i = s.following.indexOf(id);
      if (i === -1) s.following.push(id); else s.following.splice(i, 1);
      SM.store.save();
      return i === -1;
    },
    togglePostLike: function (id) {
      var s = SM.store.get();
      var on = !s.postLikes[id];
      if (on) s.postLikes[id] = 1; else delete s.postLikes[id];
      SM.store.save();
      return on;
    },
    addComment: function (postId, text) {
      var s = SM.store.get();
      if (!s.comments[postId]) s.comments[postId] = [];
      s.comments[postId].push({ me: true, t: text, at: Date.now() });
      SM.store.save();
    },
    publish: function (outfitId, caption) {
      var s = SM.store.get();
      var post = { id: 'me-' + Date.now(), outfitId: outfitId, caption: caption, at: Date.now(), likes: 0 };
      s.myPosts.unshift(post);
      SM.store.save();
      return post;
    },
    deletePost: function (id) {
      var s = SM.store.get();
      s.myPosts = s.myPosts.filter(function (p) { return p.id !== id; });
      SM.store.save();
    },

    /* ---------- messages ---------- */
    thread: function (personId) {
      var s = SM.store.get();
      var t = s.threads.filter(function (x) { return x.personId === personId; })[0];
      if (!t) { t = { personId: personId, messages: [], unread: 0 }; s.threads.unshift(t); SM.store.save(); }
      return t;
    },
    sendMessage: function (personId, text) {
      var t = SM.store.thread(personId);
      t.messages.push({ me: true, t: text, at: Date.now() });
      SM.store.save();
      return t;
    },
    markRead: function (personId) {
      SM.store.thread(personId).unread = 0;
      SM.store.save();
    },
    unreadTotal: function () {
      return SM.store.get().threads.reduce(function (a, t) { return a + (t.unread || 0); }, 0);
    }
  };

  /* ---------- community posts, generated once ------------------ */
  SM.communityPosts = function () {
    if (SM._posts) return SM._posts;
    var posts = [];
    SM.PEOPLE.forEach(function (person, pi) {
      var profile = { axes: SM.normaliseAxes(person.axes), seed: person.id, rev: 0 };
      for (var k = 0; k < 3; k++) {
        var outfit = SM.stylist.build(profile, SM.emptyFilters(), person.id + ':' + k);
        var r = SM.rng(person.id + k);
        posts.push({
          id: person.id + '-' + k,
          personId: person.id,
          outfitId: outfit.id,
          caption: SM.CAPTIONS[(pi * 3 + k) % SM.CAPTIONS.length],
          likes: 40 + Math.floor(r() * 4200),
          at: Date.now() - Math.floor(r() * 1000 * 60 * 60 * 90),
          comments: SM.COMMENTS.filter(function (c) { return c.p !== person.id; })
            .slice(Math.floor(r() * 3), Math.floor(r() * 3) + 2 + Math.floor(r() * 2))
        });
      }
    });
    posts.sort(function (a, b) { return b.at - a.at; });
    SM._posts = posts;
    SM.POST_BY_ID = {};
    posts.forEach(function (p) { SM.POST_BY_ID[p.id] = p; });
    return posts;
  };
})(window.SM);

</script>
<script>
/* ============================================================
   STYLE ME — ui.js
   Shared interface parts: icons, product tiles, credit rows,
   sheets, toasts.
   ============================================================ */

window.SM = window.SM || {};

(function (SM) {
  'use strict';

  var ui = {};
  SM.ui = ui;

  ui.esc = function (s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };

  var money = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  ui.price = function (n) { return money.format(n); };

  ui.compact = function (n) {
    if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace('.0', '') + 'k';
    return String(n);
  };

  ui.timeAgo = function (ts) {
    if (typeof ts === 'string') return ts;
    var m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h';
    return Math.floor(h / 24) + 'd';
  };

  /* ---------- icons -------------------------------------------- */
  var ICONS = {
    heart: '<path d="M12 20.5 4.3 13a4.6 4.6 0 0 1 6.5-6.5l1.2 1.2 1.2-1.2A4.6 4.6 0 0 1 19.7 13z"/>',
    bookmark: '<path d="M6 3.5h12v17l-6-4.2-6 4.2z"/>',
    comment: '<path d="M20.5 12.2c0 4-3.8 7.2-8.5 7.2a10 10 0 0 1-2.6-.34L4 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12.2C3.5 8.2 7.3 5 12 5s8.5 3.2 8.5 7.2z"/>',
    share: '<path d="M4 12v7.5h16V12"/><path d="M12 15.5V3.5"/><path d="m7.5 8 4.5-4.5L16.5 8"/>',
    swap: '<path d="M4 8h13l-3.5-3.5"/><path d="M20 16H7l3.5 3.5"/>',
    filter: '<path d="M3.5 6h17"/><path d="M6.5 12h11"/><path d="M10 18h4"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
    home: '<path d="M4 10.5 12 4l8 6.5V20H4z"/>',
    users: '<circle cx="9" cy="9" r="3.4"/><path d="M3 20c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"/><path d="M16 6.2a3.4 3.4 0 0 1 0 6.6"/><path d="M17.5 14.9c2.2.6 3.5 2.4 3.5 5.1"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/>',
    user: '<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c0-3.9 3.3-6.4 7.5-6.4s7.5 2.5 7.5 6.4"/>',
    back: '<path d="M15 4.5 7.5 12l7.5 7.5"/>',
    close: '<path d="M5.5 5.5 18.5 18.5"/><path d="M18.5 5.5 5.5 18.5"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7"/>',
    camera: '<path d="M3.5 8h4l1.5-2.5h6L16.5 8h4v12h-17z"/><circle cx="12" cy="13.5" r="3.6"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 5.3l-1.6 1.6"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1.6-1.6"/>',
    sparkle: '<path d="M12 3.5 13.9 9 19.5 11 13.9 13 12 18.5 10.1 13 4.5 11 10.1 9z"/><path d="M18.5 4v3"/><path d="M20 5.5h-3"/>',
    send: '<path d="M4 12 20.5 4.5 13.5 20.5 11.5 13z"/>',
    trash: '<path d="M4.5 7h15"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7 7.5 20h9L17.5 7"/>',
    settings: '<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/>',
    shuffle: '<rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/>',
    bag: '<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6.2a3 3 0 0 1 6 0V8"/>'
  };

  ui.icon = function (name, opt) {
    opt = opt || {};
    return '<svg class="ic ' + (opt.cls || '') + '" viewBox="0 0 24 24" fill="' + (opt.fill ? 'currentColor' : 'none') +
      '" stroke="currentColor" stroke-width="' + (opt.sw || 1.6) +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  };

  /* ---------- product imagery ---------------------------------- */
  ui.shot = function (item, cls) {
    return '<div class="shot-frame ' + (cls || '') + '">' + SM.garment.productShot(item) + '</div>';
  };

  ui.tile = function (item, opts) {
    opts = opts || {};
    return '<a class="tile" href="#/item/' + item.id + '">' +
      ui.shot(item) +
      '<span class="tile-brand">' + ui.esc(item.brand) + '</span>' +
      '<span class="tile-name">' + ui.esc(item.name) + '</span>' +
      '<span class="tile-meta"><span class="tile-price">' + ui.price(item.price) + '</span>' +
      (opts.colour === false ? '' : '<span class="tile-colour"><i style="background:' + item.colour + '"></i>' + ui.esc(item.colourName) + '</span>') +
      '</span></a>';
  };

  /* The credit line — how a magazine lists what someone is
     wearing. Reused everywhere a look is broken down. */
  ui.creditRow = function (item, opts) {
    opts = opts || {};
    var LABEL = { top: 'Top', bottom: 'Bottom', outer: 'Outerwear', shoes: 'Footwear', accessory: 'Accessory', dress: 'Dress' };
    return '<div class="credit" data-item="' + item.id + '">' +
      '<a class="credit-thumb" href="#/item/' + item.id + '">' + SM.garment.productShot(item) + '</a>' +
      '<span class="credit-main">' +
        '<span class="credit-cat">' + (LABEL[item.category] || '') + '</span>' +
        '<a class="credit-name" href="#/item/' + item.id + '">' + ui.esc(item.name) + '</a>' +
        '<span class="credit-brand">' + ui.esc(item.brand) + ' · ' + ui.esc(item.colourName) + '</span>' +
      '</span>' +
      '<span class="credit-price">' + ui.price(item.price) + '</span>' +
      (opts.swap ? '<button class="credit-swap" data-swap="' + item.id + '" aria-label="Replace ' + ui.esc(item.name) + '">' +
        ui.icon('swap') + '</button>' : '') +
      '</div>';
  };

  /* ---------- avatar ------------------------------------------- */
  ui.avatar = function (look, cls) {
    var paint = SM.newPaint();
    var sk = SM.figure.skeleton(look || {});
    var cx = sk.cx + sk.shoulderOff;
    var box = sk.headRx * 2.5;
    return '<svg class="av ' + (cls || '') + '" viewBox="' + (cx - box / 2) + ' ' + (sk.headCy - box / 2 + 4) +
      ' ' + box + ' ' + box + '" aria-hidden="true">' +
      '<rect x="' + (cx - box) + '" y="' + (sk.headCy - box) + '" width="' + (box * 2) + '" height="' + (box * 2) +
      '" fill="' + SM.color.shade((look && look.skin) || '#E3B48D', -0.62) + '"/>' +
      SM.figure.hairBack(sk, look || {}, paint) +
      SM.figure.head(sk, look || {}, paint) +
      SM.figure.hairFront(sk, look || {}, paint) +
      paint.markup() + '</svg>';
  };

  /* ---------- axis bars ---------------------------------------- */
  ui.axisBars = function (axes, limit) {
    var keys = SM.AXIS_KEYS.slice().sort(function (a, b) { return axes[b] - axes[a]; });
    if (limit) keys = keys.slice(0, limit);
    return '<div class="axes">' + keys.map(function (k) {
      return '<div class="axis">' +
        '<span class="axis-label">' + SM.AXES[k].label + '</span>' +
        '<span class="axis-track"><span class="axis-fill" style="width:' + Math.max(4, axes[k]) + '%"></span></span>' +
        '<span class="axis-val">' + axes[k] + '</span></div>';
    }).join('') + '</div>';
  };

  /* ---------- chrome ------------------------------------------- */
  ui.header = function (title, opts) {
    opts = opts || {};
    return '<header class="scr-head">' +
      (opts.back ? '<button class="icon-btn" data-back="1" aria-label="Back">' + ui.icon('back') + '</button>' : '') +
      '<div class="scr-head-txt">' +
        (opts.kicker ? '<span class="kicker">' + ui.esc(opts.kicker) + '</span>' : '') +
        '<h1 class="scr-title">' + ui.esc(title) + '</h1>' +
      '</div>' + (opts.action || '') + '</header>';
  };

  ui.empty = function (title, sub, cta) {
    return '<div class="empty"><p class="empty-title">' + ui.esc(title) + '</p>' +
      '<p class="empty-sub">' + ui.esc(sub) + '</p>' + (cta || '') + '</div>';
  };

  /* ---------- toast -------------------------------------------- */
  var toastTimer;
  ui.toast = function (message) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.className = 'toast show';
    el.textContent = message;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, 2400);
  };

  /* ---------- sheet -------------------------------------------- */
  ui.sheet = function (opts) {
    var host = document.getElementById('sheet');
    host.innerHTML =
      '<div class="sheet-scrim" data-close="1"></div>' +
      '<div class="sheet-panel" role="dialog" aria-modal="true" aria-label="' + ui.esc(opts.title || '') + '">' +
        '<div class="sheet-head"><h2 class="sheet-title">' + ui.esc(opts.title || '') + '</h2>' +
        '<button class="icon-btn" data-close="1" aria-label="Close">' + ui.icon('close') + '</button></div>' +
        (opts.sub ? '<p class="sheet-sub">' + ui.esc(opts.sub) + '</p>' : '') +
        '<div class="sheet-body">' + (opts.body || '') + '</div>' +
      '</div>';
    host.classList.add('open');
    document.body.classList.add('no-scroll');
    if (opts.onMount) opts.onMount(host);
    return host;
  };

  ui.closeSheet = function () {
    var host = document.getElementById('sheet');
    host.classList.remove('open');
    document.body.classList.remove('no-scroll');
    setTimeout(function () { if (!host.classList.contains('open')) host.innerHTML = ''; }, 220);
  };

  /* ---------- misc --------------------------------------------- */
  ui.share = function (path, label) {
    var url = location.href.split('#')[0] + path;
    if (navigator.share) {
      navigator.share({ title: 'Style Me', text: label || 'Look at this', url: url }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () { ui.toast('Link copied'); });
    } else {
      ui.toast(url);
    }
  };

  /* Photos are shrunk before they are stored — localStorage is
     small and a phone camera file is not. */
  ui.downscale = function (file, max, done) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        done(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
})(window.SM);

</script>
<script>
/* ============================================================
   STYLE ME — views.js
   One object per screen: { chrome, render(params), mount(root) }
   ============================================================ */

window.SM = window.SM || {};

(function (SM) {
  'use strict';

  var ui = SM.ui;
  var esc = ui.esc;
  var V = {};
  SM.views = V;

  function go(hash) { location.hash = hash; }
  function profile() { return SM.store.profile(); }
  function state() { return SM.store.get(); }
  function outfitFromId(id) { return SM.stylist.fromId(id, profile()); }

  /* Copy from the stylist arrives asynchronously; cache it so the
     same outfit doesn't get re-described on every repaint. */
  var copyCache = {};
  function copyFor(outfit, onReady) {
    if (copyCache[outfit.id]) {
      if (onReady) onReady(copyCache[outfit.id]);
      return copyCache[outfit.id];
    }
    SM.ai.describe(outfit, profile()).then(function (text) {
      copyCache[outfit.id] = text;
      if (onReady) onReady(text);
    });
    return '';
  }

  /* ============================================================
     Welcome
     ============================================================ */
  V.welcome = {
    chrome: false,
    render: function () {
      var demo = [
        ['knit-turtle', 'trouser-pleated', 'derby-black', 'coat-wool-long'],
        ['tee-black-boxy', 'jeans-wide', 'sneaker-canvas', 'cap-six-panel'],
        ['dress-slip', 'jacket-leather', 'heel-slim']
      ];
      var figures = demo.map(function (ids, i) {
        var outfit = SM.stylist.wrap(ids.map(function (id) { return SM.CATALOG.byId[id]; }), null);
        var look = SM.store.lookFor(outfit);
        return '<div class="welcome-fig f' + i + '">' + SM.fit.render(outfit, look) + '</div>';
      }).join('');

      return '<div class="welcome">' +
        '<div class="welcome-art" aria-hidden="true">' + figures + '</div>' +
        '<div class="welcome-body">' +
          '<p class="kicker">Find what you actually wear</p>' +
          '<h1 class="wordmark">Style<span></span>Me</h1>' +
          '<p class="lede">Twelve questions that are barely about clothes. Then a feed of outfits built ' +
            'for you — and you can take any of them apart, piece by piece.</p>' +
          '<button class="btn btn-primary btn-lg" data-nav="#/quiz">Take the style test</button>' +
          '<button class="btn btn-ghost" data-nav="#/feed">Skip and browse</button>' +
        '</div></div>';
    }
  };

  /* ============================================================
     Quiz
     ============================================================ */
  var quiz = { index: 0, answers: {} };

  V.quiz = {
    chrome: false,
    render: function () {
      quiz = { index: 0, answers: Object.assign({}, state().profile.answers || {}) };
      return '<div class="quiz">' +
        '<div class="quiz-top">' +
          '<button class="icon-btn" data-quiz-back aria-label="Previous question">' + ui.icon('back') + '</button>' +
          '<div class="quiz-progress"><span id="qfill"></span></div>' +
          '<span class="mono" id="qcount">1/' + SM.QUESTIONS.length + '</span>' +
        '</div>' +
        '<div class="quiz-stage" id="qstage"></div></div>';
    },
    mount: function (root) {
      function draw() {
        var q = SM.QUESTIONS[quiz.index];
        root.querySelector('#qstage').innerHTML =
          '<div class="q">' +
            '<p class="kicker">' + esc(q.kicker) + '</p>' +
            '<h1 class="q-title">' + esc(q.q) + '</h1>' +
            '<div class="q-options">' + q.options.map(function (o, i) {
              return '<button class="q-option' + (quiz.answers[q.id] === i ? ' on' : '') + '" data-option="' + i + '">' +
                '<span class="q-mark" aria-hidden="true"></span><span>' + esc(o.t) + '</span></button>';
            }).join('') + '</div></div>';
        root.querySelector('#qfill').style.width = (quiz.index / SM.QUESTIONS.length * 100) + '%';
        root.querySelector('#qcount').textContent = (quiz.index + 1) + '/' + SM.QUESTIONS.length;
      }
      draw();

      root.addEventListener('click', function (e) {
        var opt = e.target.closest('[data-option]');
        if (opt) {
          var q = SM.QUESTIONS[quiz.index];
          quiz.answers[q.id] = parseInt(opt.getAttribute('data-option'), 10);
          root.querySelectorAll('.q-option').forEach(function (b) { b.classList.remove('on'); });
          opt.classList.add('on');
          setTimeout(function () {
            if (quiz.index < SM.QUESTIONS.length - 1) { quiz.index++; draw(); }
            else finish();
          }, 190);
          return;
        }
        if (e.target.closest('[data-quiz-back]')) {
          if (quiz.index > 0) { quiz.index--; draw(); } else go('#/');
        }
      });

      function finish() {
        var s = state();
        s.profile.answers = quiz.answers;
        s.profile.axes = SM.scoreQuiz(quiz.answers);
        s.profile.rev = 0;
        s.onboarded = true;
        SM.store.save();
        copyCache = {};
        go('#/dna');
      }
    }
  };

  /* ============================================================
     Style DNA
     ============================================================ */
  V.dna = {
    chrome: false,
    render: function () {
      var p = profile();
      var arch = SM.archetype(p.axes);
      var explore = SM.explorationAxes(p.axes);
      var picks = SM.stylist.feed(p, SM.emptyFilters(), 0, 3);
      return '<div class="dna">' +
        '<div class="dna-hero">' +
          '<p class="kicker">Your profile</p>' +
          '<h1 class="dna-name">' + esc(arch.name) + '</h1>' +
          '<p class="dna-line">' + esc(arch.line) + '</p>' +
        '</div>' +
        '<div class="dna-body">' +
          '<h2 class="sec-title">What pulls you</h2>' + ui.axisBars(p.axes, 6) +
          '<h2 class="sec-title">Worth exploring</h2>' +
          '<p class="muted">Neither what you already are nor what you clearly reject. The feed will slip these in.</p>' +
          '<div class="chips">' + explore.map(function (k) {
            return '<span class="chip">' + SM.AXES[k].label + '</span>';
          }).join('') + '</div>' +
          '<h2 class="sec-title">Three to start with</h2>' +
          '<div class="look-row">' + picks.map(lookThumb).join('') + '</div>' +
          '<div class="dna-cta">' +
            '<button class="btn btn-primary btn-lg" data-nav="#/feed">Open my feed</button>' +
            '<button class="btn btn-ghost" data-nav="#/quiz">Retake the test</button>' +
          '</div>' +
        '</div></div>';
    }
  };

  function lookThumb(outfit) {
    return '<a class="look-thumb" href="#/outfit/' + outfit.id + '">' +
      SM.fit.render(outfit, SM.store.lookFor(outfit)) +
      '<span class="look-cap mono">' + ui.price(outfit.total) + '</span></a>';
  }

  /* ============================================================
     Feed
     ============================================================ */
  var feed = { outfits: [], next: 0, observer: null };

  V.feed = {
    chrome: true,
    render: function () {
      feed.outfits = [];
      feed.next = 0;
      var s = state();
      var n = SM.filterCount(s.filters);
      return '<div class="feed">' +
        '<div class="feed-top">' +
          '<a class="wordmark sm" href="#/me">Style<span></span>Me</a>' +
          '<div class="feed-top-actions">' +
            '<button class="pill-btn' + (s.me.useMe ? ' on' : '') + '" data-act="onme">' + ui.icon('user') + '<span>On me</span></button>' +
            '<button class="pill-btn' + (n ? ' on' : '') + '" data-nav="#/shop">' + ui.icon('filter') +
              '<span>Filters' + (n ? ' · ' + n : '') + '</span></button>' +
          '</div></div>' +
        '<div class="feed-scroll" id="feedScroll" tabindex="0"></div></div>';
    },
    mount: function (root) {
      var scroll = root.querySelector('#feedScroll');
      appendCards(scroll, 4);

      feed.observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          hydrate(entry.target);
          if (entry.intersectionRatio > 0.6) {
            var idx = parseInt(entry.target.getAttribute('data-index'), 10);
            if (idx >= feed.outfits.length - 3) appendCards(scroll, 3);
          }
        });
      }, { root: scroll, threshold: [0, 0.6], rootMargin: '120% 0px' });

      scroll.querySelectorAll('.card').forEach(function (c) { feed.observer.observe(c); });

      scroll.addEventListener('click', onCardClick);
      scroll.addEventListener('dblclick', function (e) {
        var card = e.target.closest('.card');
        if (card) { e.preventDefault(); like(card, true); }
      });
      scroll.addEventListener('keydown', function (e) {
        if (e.key === 'l' || e.key === 'L') {
          var card = currentCard(scroll);
          if (card) like(card, true);
        }
      });
      scroll.focus({ preventScroll: true });

      root.querySelector('[data-act="onme"]').addEventListener('click', function () {
        var s = state();
        if (!s.me.photos.face && !s.me.age && !s.me.weightKg) {
          go('#/studio');
          ui.toast('Add your measurements to see outfits on yourself');
          return;
        }
        s.me.useMe = !s.me.useMe;
        SM.store.save();
        this.classList.toggle('on', s.me.useMe);
        scroll.querySelectorAll('.card').forEach(function (c) {
          c.removeAttribute('data-hydrated');
          c.querySelector('.card-stage').innerHTML = '';
          hydrate(c);
        });
        ui.toast(s.me.useMe ? 'Outfits are now shown on your avatar' : 'Back to generated models');
      });
    },
    unmount: function () {
      if (feed.observer) { feed.observer.disconnect(); feed.observer = null; }
    }
  };

  function currentCard(scroll) {
    var cards = scroll.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect();
      if (r.top > -80 && r.top < 200) return cards[i];
    }
    return cards[0];
  }

  function appendCards(scroll, n) {
    var s = state();
    var batch = SM.stylist.feed(s.profile, s.filters, feed.next, n);
    feed.next += n;
    feed.outfits = feed.outfits.concat(batch);
    var tmp = document.createElement('div');
    tmp.innerHTML = batch.map(cardHTML).join('');
    while (tmp.firstChild) {
      var node = tmp.firstChild;
      scroll.appendChild(node);
      if (feed.observer && node.nodeType === 1) feed.observer.observe(node);
    }
  }

  function cardHTML(outfit) {
    var liked = SM.store.isLiked(outfit.id);
    var saved = SM.store.isSaved(outfit.id);
    var title = SM.ai.title(outfit, state().profile);
    return '<article class="card" data-outfit="' + outfit.id + '" data-index="' + outfit.index + '">' +
      '<div class="card-stage"></div>' +
      '<div class="card-veil"></div>' +
      '<div class="card-rail">' +
        '<button class="rail-btn' + (liked ? ' liked' : '') + '" data-act="like" aria-pressed="' + liked + '" aria-label="Like">' +
          ui.icon('heart', { fill: liked }) + '</button>' +
        '<button class="rail-btn' + (saved ? ' saved' : '') + '" data-act="save" aria-pressed="' + saved + '" aria-label="Save">' +
          ui.icon('bookmark', { fill: saved }) + '</button>' +
        '<button class="rail-btn" data-act="detail" aria-label="Outfit details">' + ui.icon('swap') + '</button>' +
        '<button class="rail-btn" data-act="variant" aria-label="Another version">' + ui.icon('shuffle') + '</button>' +
        '<button class="rail-btn" data-act="share" aria-label="Share">' + ui.icon('share') + '</button>' +
      '</div>' +
      '<div class="card-info">' +
        '<div class="card-pills">' +
          '<span class="pill accent mono">' + outfit.match + '% you</span>' +
          '<span class="pill mono">' + (outfit.kind === 'piece' ? 'One piece' : outfit.items.length + ' pieces') + '</span>' +
          '<span class="pill mono">' + ui.price(outfit.total) + '</span>' +
        '</div>' +
        (outfit.kind === 'piece'
          ? '<p class="card-hero mono">The piece: ' + esc(outfit.hero.name) + ' — ' + esc(outfit.hero.brand) + '</p>' : '') +
        '<h2 class="card-title">' + esc(title) + '</h2>' +
        '<p class="card-why" data-why>' + esc(copyFor(outfit, function (t) {
          var el = document.querySelector('.card[data-outfit="' + outfit.id + '"] [data-why]');
          if (el) el.textContent = t;
        })) + '</p>' +
        '<div class="card-credits">' + outfit.items.slice(0, 2).map(function (i) { return ui.creditRow(i); }).join('') +
          '<button class="link-btn" data-act="detail">See all ' + outfit.items.length + ' pieces and swap</button>' +
        '</div>' +
      '</div>' +
      '<div class="burst" aria-hidden="true">' + ui.icon('heart', { fill: true }) + '</div>' +
      '</article>';
  }

  function hydrate(card) {
    if (card.getAttribute('data-hydrated')) return;
    var outfit = outfitFromId(card.getAttribute('data-outfit'));
    if (!outfit) return;
    card.querySelector('.card-stage').innerHTML = SM.fit.render(outfit, SM.store.lookFor(outfit));
    card.setAttribute('data-hydrated', '1');
  }

  function like(card, force) {
    var id = card.getAttribute('data-outfit');
    var outfit = outfitFromId(id);
    var btn = card.querySelector('[data-act="like"]');
    if (force && SM.store.isLiked(id)) { burst(card); return; }
    var on = SM.store.toggleLike(outfit);
    btn.classList.toggle('liked', on);
    btn.setAttribute('aria-pressed', String(on));
    btn.innerHTML = ui.icon('heart', { fill: on });
    if (on) burst(card);
  }

  function burst(card) {
    var b = card.querySelector('.burst');
    b.classList.remove('go');
    void b.getBoundingClientRect();
    b.classList.add('go');
  }

  function onCardClick(e) {
    var btn = e.target.closest('[data-act]');
    var card = e.target.closest('.card');
    if (!card || !btn) return;
    var act = btn.getAttribute('data-act');
    var id = card.getAttribute('data-outfit');

    if (act === 'like') return like(card);
    if (act === 'save') {
      var on = SM.store.toggleSave(id);
      btn.classList.toggle('saved', on);
      btn.innerHTML = ui.icon('bookmark', { fill: on });
      ui.toast(on ? 'Outfit saved' : 'Removed from saved');
      return;
    }
    if (act === 'detail') return go('#/outfit/' + id);
    if (act === 'share') return ui.share('#/outfit/' + id, 'Look at this outfit');
    if (act === 'variant') {
      var outfit = outfitFromId(id);
      var keep = outfit.items.filter(function (i) { return i.category === 'top' || i.category === 'dress'; });
      var fresh = SM.stylist.build(state().profile, state().filters, id + Date.now());
      var mixed = keep.concat(fresh.items.filter(function (i) { return i.category !== 'top' && i.category !== 'dress'; }));
      var next = SM.stylist.wrap(mixed, state().profile);
      card.setAttribute('data-outfit', next.id);
      card.removeAttribute('data-hydrated');
      hydrate(card);
      card.querySelector('.card-credits').innerHTML =
        next.items.slice(0, 2).map(function (i) { return ui.creditRow(i); }).join('') +
        '<button class="link-btn" data-act="detail">See all ' + next.items.length + ' pieces and swap</button>';
      var why = card.querySelector('.card-why');
      copyFor(next, function (t) { why.textContent = t; });
      ui.toast('Same top, everything else changed');
    }
  }

  /* ============================================================
     Outfit — the page a look links to
     ============================================================ */
  var current = null;

  V.outfit = {
    chrome: true,
    render: function (params) {
      var outfit = outfitFromId(params.id);
      if (!outfit) {
        return ui.empty('Outfit not found', 'That link doesn’t match any combination.',
          '<button class="btn btn-primary" data-nav="#/feed">Back to the feed</button>');
      }
      current = outfit;
      return '<div class="outfit">' +
        ui.header(SM.ai.title(outfit, profile()), {
          back: true, kicker: 'Outfit',
          action: '<button class="icon-btn" data-act="share" aria-label="Share">' + ui.icon('share') + '</button>'
        }) +
        '<div class="outfit-grid">' +
          '<div class="outfit-stage" id="outfitStage">' + SM.fit.render(outfit, SM.store.lookFor(outfit)) +
            '<p class="stage-note mono">Every piece is its own layer. Swap one and the rest stays put.</p></div>' +
          '<div class="outfit-side">' +
            '<div class="outfit-actions">' +
              '<button class="btn' + (SM.store.isLiked(outfit.id) ? ' on' : '') + '" data-act="like">' +
                ui.icon('heart', { fill: SM.store.isLiked(outfit.id) }) + '<span>Like</span></button>' +
              '<button class="btn' + (SM.store.isSaved(outfit.id) ? ' on' : '') + '" data-act="save">' +
                ui.icon('bookmark', { fill: SM.store.isSaved(outfit.id) }) + '<span>Save</span></button>' +
              '<button class="btn" data-act="publish">' + ui.icon('plus') + '<span>Post</span></button>' +
            '</div>' +
            '<p class="why-block" id="whyBlock"></p>' +
            '<div class="side-head"><h2 class="sec-title">Credits</h2>' +
              '<span class="mono muted" id="outfitTotal">' + ui.price(outfit.total) + '</span></div>' +
            '<div class="credits" id="creditList">' +
              outfit.items.map(function (i) { return ui.creditRow(i, { swap: true }); }).join('') + '</div>' +
            '<button class="btn btn-ghost full" data-act="addpiece">' + ui.icon('plus') + '<span>Add a piece</span></button>' +
            '<p class="disclaimer">Demo catalogue. Prices are indicative; links open a search on the brand’s own site.</p>' +
          '</div></div></div>';
    },
    mount: function (root) {
      var why = root.querySelector('#whyBlock');
      if (why) copyFor(current, function (t) { why.textContent = t; });

      root.addEventListener('click', function (e) {
        var swap = e.target.closest('[data-swap]');
        if (swap) return openSwap(root, swap.getAttribute('data-swap'));
        var btn = e.target.closest('[data-act]');
        if (!btn) return;
        var act = btn.getAttribute('data-act');
        if (act === 'like') {
          var on = SM.store.toggleLike(current);
          btn.classList.toggle('on', on);
          btn.querySelector('svg').outerHTML = ui.icon('heart', { fill: on });
          ui.toast(on ? 'Liked — your feed will adjust' : 'Removed');
        } else if (act === 'save') {
          var saved = SM.store.toggleSave(current.id);
          btn.classList.toggle('on', saved);
          ui.toast(saved ? 'Outfit saved' : 'Removed from saved');
        } else if (act === 'share') {
          ui.share('#/outfit/' + current.id, 'Look at this outfit');
        } else if (act === 'publish') {
          openPublish(current);
        } else if (act === 'addpiece') {
          openAdd(root);
        }
      });
    }
  };

  function repaintLayers(root, items) {
    var svg = root.querySelector('#outfitStage svg');
    var look = SM.store.lookFor(current);
    var seen = {};
    items.filter(Boolean).forEach(function (item) {
      var layer = SM.fitLayerOf(item);
      if (seen[layer]) return;
      seen[layer] = 1;
      SM.fit.updateLayer(svg, current, look, layer);
    });
  }

  function refreshSide(root) {
    root.querySelector('#creditList').innerHTML =
      current.items.map(function (i) { return ui.creditRow(i, { swap: true }); }).join('');
    root.querySelector('#outfitTotal').textContent = ui.price(current.total);
    var why = root.querySelector('#whyBlock');
    SM.ai.describe(current, profile()).then(function (t) { if (why) why.textContent = t; });
    history.replaceState(null, '', '#/outfit/' + current.id);
  }

  function openSwap(root, itemId) {
    var item = SM.CATALOG.byId[itemId];
    var alternatives = SM.stylist.alternatives(current, item, profile(), state().filters, 30);
    ui.sheet({
      title: 'Replace: ' + item.name,
      sub: 'Only this layer is redrawn. The rest of the outfit stays exactly as it is.',
      body: '<div class="alt-grid">' + alternatives.map(function (a) {
        return '<button class="alt" data-alt="' + a.item.id + '">' +
          '<span class="alt-shot">' + SM.garment.productShot(a.item) + '</span>' +
          '<span class="alt-name">' + esc(a.item.name) + '</span>' +
          '<span class="alt-meta mono">' + esc(a.item.brand) + ' · ' + ui.price(a.item.price) + '</span></button>';
      }).join('') +
        '<button class="alt alt-remove" data-remove="' + item.id + '">' +
          '<span class="alt-shot">' + ui.icon('trash') + '</span>' +
          '<span class="alt-name">Remove this piece</span></button>' +
        '</div>',
      onMount: function (host) {
        host.addEventListener('click', function (e) {
          var remove = e.target.closest('[data-remove]');
          if (remove) {
            current = SM.stylist.remove(current, remove.getAttribute('data-remove'), profile());
            repaintLayers(root, [item]);
            refreshSide(root);
            ui.closeSheet();
            ui.toast('Piece removed');
            return;
          }
          var alt = e.target.closest('[data-alt]');
          if (!alt) return;
          var newId = alt.getAttribute('data-alt');
          current = SM.stylist.swap(current, itemId, newId, profile());
          repaintLayers(root, [item, SM.CATALOG.byId[newId]]);
          refreshSide(root);
          ui.closeSheet();
          ui.toast(SM.CATALOG.byId[newId].name + ' — nothing else moved');
        });
      }
    });
  }

  function openAdd(root) {
    var have = {};
    current.items.forEach(function (i) { have[i.category] = true; });
    var pool = SM.CATALOG.items.filter(function (i) {
      return i.category === 'accessory' || !have[i.category];
    }).slice(0, 60);
    ui.sheet({
      title: 'Add a piece',
      body: '<div class="alt-grid">' + pool.map(function (i) {
        return '<button class="alt" data-add="' + i.id + '">' +
          '<span class="alt-shot">' + SM.garment.productShot(i) + '</span>' +
          '<span class="alt-name">' + esc(i.name) + '</span>' +
          '<span class="alt-meta mono">' + esc(i.brand) + ' · ' + ui.price(i.price) + '</span></button>';
      }).join('') + '</div>',
      onMount: function (host) {
        host.addEventListener('click', function (e) {
          var add = e.target.closest('[data-add]');
          if (!add) return;
          var item = SM.CATALOG.byId[add.getAttribute('data-add')];
          current = SM.stylist.add(current, item.id, profile());
          repaintLayers(root, [item]);
          refreshSide(root);
          ui.closeSheet();
          ui.toast(item.name + ' added');
        });

        '</div>';
    },
    mount: function (root) {
      var f = state().filters;
      function draw() {
        var results = SM.stylist.search(root.querySelector('#q').value, f, profile()).slice(0, 48);
        root.querySelector('#results').innerHTML =
          '<h2 class="sec-title">' + results.length + ' piece' + (results.length === 1 ? '' : 's') + '</h2>' +
          '<div class="tile-grid">' + results.map(function (i) { return ui.tile(i); }).join('') + '</div>';
      }
      draw();

      root.querySelector('#q').addEventListener('input', draw);
      root.querySelector('#bt').addEventListener('input', function () {
        var v = parseInt(this.value, 10);
        f.budgetTotal = v === 0 ? null : v;
        root.querySelector('#btLabel').textContent = v === 0 ? 'no limit' : ui.price(v);
        SM.store.save();
      });
      root.querySelector('#bp').addEventListener('input', function () {
        var v = parseInt(this.value, 10);
        f.budgetPiece = v === 0 ? null : v;
        root.querySelector('#bpLabel').textContent = v === 0 ? 'no limit' : ui.price(v);
        SM.store.save();
        draw();
      });

      root.addEventListener('click', function (e) {
        var tog = e.target.closest('[data-f]');
        if (tog) {
          var key = tog.getAttribute('data-f');
          var val = tog.getAttribute('data-v');
          if (key === 'tiers') val = parseInt(val, 10);
          var arr = f[key];
          var i = arr.indexOf(val);
          if (i === -1) arr.push(val); else arr.splice(i, 1);
          tog.classList.toggle('on', i === -1);
          SM.store.save();
          draw();
          return;
        }
        var act = e.target.closest('[data-act]');
        if (!act) return;
        if (act.getAttribute('data-act') === 'reset') {
          state().filters = SM.emptyFilters();
          SM.store.save();
          SM.render();
          ui.toast('Filters cleared');
        } else {
          go('#/feed');
          ui.toast('Feed rebuilt with your filters');
        }
      });
    }
  };

        '<form class="chat-form" id="chatForm">' +
          '<input id="chatInput" placeholder="Write a message…" autocomplete="off">' +
          '<button class="icon-btn accent" type="submit" aria-label="Send">' + ui.icon('send') + '</button>' +
        '</form></div>';
    },
    mount: function (root) {
      var box = root.querySelector('#bubbles');
      if (!box) return;
      box.scrollTop = box.scrollHeight;
      var id = location.hash.split('/')[2];
      root.querySelector('#chatForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var input = root.querySelector('#chatInput');
        var v = input.value.trim();
        if (!v) return;
        SM.store.sendMessage(id, v);
        box.insertAdjacentHTML('beforeend', bubble({ me: true, t: v, at: Date.now() }));
        input.value = '';
        box.scrollTop = box.scrollHeight;

        var typing = document.createElement('div');
        typing.className = 'bubble them typing';
        typing.innerHTML = '<span></span><span></span><span></span>';
        box.appendChild(typing);
        box.scrollTop = box.scrollHeight;
        setTimeout(function () {
          typing.remove();
          var reply = SM.AUTO_REPLIES[Math.floor(Math.random() * SM.AUTO_REPLIES.length)];
          SM.store.thread(id).messages.push({ me: false, t: reply, at: Date.now() });
          SM.store.save();
          box.insertAdjacentHTML('beforeend', bubble({ me: false, t: reply, at: Date.now() }));
          box.scrollTop = box.scrollHeight;
        }, 1400);
      });
    }
  };

  function bubble(m) {
    return '<div class="bubble ' + (m.me ? 'me' : 'them') + '">' + esc(m.t) + '</div>';
  }

  /* ============================================================
     Me / saved / bag / studio
     ============================================================ */
  V.me = {
    chrome: true,
    render: function () {
      var s = state();
      var p = profile();
      var arch = SM.archetype(p.axes);
      return '<div class="profile">' +
        ui.header(s.me.name, { kicker: '@' + s.me.handle,
          action: '<button class="icon-btn" data-nav="#/studio" aria-label="Studio">' + ui.icon('settings') + '</button>' }) +
        '<div class="prof-head">' +
          '<span class="prof-av">' + ui.avatar(SM.store.myLook()) + '</span>' +
          '<div class="prof-stats">' +
            '<div><strong class="mono">' + Object.keys(s.likes).length + '</strong><span>likes</span></div>' +
            '<div><strong class="mono">' + s.savedOutfits.length + '</strong><span>saved</span></div>' +

        '<a class="dna-card" href="#/dna">' +
