<meta charset="utf-8">
<title>Style Me</title>
<meta name="description" content="Find your style: a personality test, a feed of outfits built for you, and every piece swappable without touching the rest.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Familjen+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap">
<style>
/* ============================================================
   STYLE ME — stylesheet

   Dark, deliberately: this is an image feed, and light chrome
   would eat the clothes. Product imagery sits on warm paper cards
   so the garments read the way they do on a shop page.

   Ink is blue-biased to sit under the ultramarine, which is used
   in flat fields rather than as a small accent. Flame is reserved
   for one thing only: the like.
   ============================================================ */

:root {
  --ink:      #0E0F12;
  --ink-1:    #14161B;
  --ink-2:    #1B1E25;
  --ink-3:    #262A33;

  --paper:    #EFEBE3;   /* product imagery ground */
  --paper-2:  #E3DED4;

  --bone:     #F2EFE9;
  --bone-2:   #CFCBC2;
  --ash:      #8E909B;
  --ash-2:    #62646E;

  --line:     rgba(242, 239, 233, .10);
  --line-2:   rgba(242, 239, 233, .20);

  --klein:    #3A34E8;
  --klein-2:  #5B56F5;
  --klein-dim: rgba(58, 52, 232, .16);
  --flame:    #FF5C42;

  --display: 'Syne', 'Futura', 'Trebuchet MS', system-ui, sans-serif;
  --ui: 'Familjen Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --mono: 'DM Mono', ui-monospace, SFMono-Regular, Consolas, monospace;

  --r-sm: 8px;
  --r: 14px;
  --r-lg: 22px;

  --nav-h: 66px;
  --rail-w: 92px;

  --shadow: 0 18px 50px rgba(0, 0, 0, .55);

  /* Studio backdrop behind a worn outfit. */
  --studio:
    radial-gradient(62% 46% at 50% 28%, rgba(255, 255, 255, .10), transparent 72%),
    linear-gradient(168deg, #2C313D, #15171D);

  /* dvh where supported, vh everywhere else — a bare dvh value is
     dropped entirely by browsers that don't know it. */
  --vh: 100vh;
  --vh88: 88vh;
  --vh78: 78vh;

  color-scheme: dark;
}
@supports (height: 100dvh) {
  :root { --vh: 100dvh; --vh88: 88dvh; --vh78: 78dvh; }
}

/* ---------- base ---------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; padding: 0; background: var(--ink); color: var(--bone); }

body {
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.no-scroll { overflow: hidden; }

h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
img { max-width: 100%; display: block; }

:focus-visible { outline: 2px solid var(--klein-2); outline-offset: 2px; border-radius: 4px; }

.mono { font-family: var(--mono); font-size: .82em; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.muted { color: var(--ash); }

.kicker {
  display: block;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ash);
}

.sec-title {
  font-family: var(--display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--bone-2);
  margin: 26px 0 12px;
}

.disclaimer { margin-top: 16px; font-size: 12px; line-height: 1.5; color: var(--ash-2); }

.ic { width: 22px; height: 22px; flex: none; }

/* ---------- shell --------------------------------------------- */
.app { min-height: var(--vh); }
.app.with-nav .screen { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); }
.app.scr-feed .screen, .app.scr-thread .screen { padding-bottom: 0; }
.screen { position: relative; }
.pad { padding-inline: 18px; }

/* ---------- navigation ---------------------------------------- */
.nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: center;
  background: rgba(14, 15, 18, .9);
  backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
  z-index: 40;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 2px;
  color: var(--ash-2);
  position: relative;
  transition: color .18s;
}
.nav-item span { font-size: 10px; letter-spacing: .03em; }
.nav-item.on { color: var(--bone); }
.nav-item.on::before {
  content: '';
  position: absolute;
  top: -1px; left: 50%;
  transform: translateX(-50%);
  width: 22px; height: 2px;
  background: var(--klein-2);
}
.badge {
  position: absolute;
  top: 4px; right: calc(50% - 16px);
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--flame);
}

/* ---------- buttons ------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: 100px;
  border: 1px solid var(--line-2);
  background: var(--ink-2);
  color: var(--bone);
  font-size: 15px;
  font-weight: 500;
  transition: background .18s, border-color .18s, transform .12s;
}
.btn:hover { background: var(--ink-3); }
.btn:active { transform: scale(.975); }
.btn.on { background: var(--klein-dim); border-color: var(--klein-2); }
.btn-primary { background: var(--klein); border-color: var(--klein); color: #fff; }
.btn-primary:hover { background: var(--klein-2); }
.btn-ghost { background: transparent; }
.btn-ghost:hover { background: var(--ink-1); }
.btn-danger { background: var(--flame); border-color: var(--flame); color: #1A0A06; font-weight: 600; }
.btn-lg { padding: 15px 26px; font-size: 16px; }
.btn.full, .btn-lg.full { display: flex; width: 100%; }
.btn.sm { padding: 7px 13px; font-size: 13px; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 40px; height: 40px;
  border-radius: 50%;
  color: var(--bone);
  position: relative;
  transition: background .18s;
}
.icon-btn:hover { background: var(--ink-2); }
.icon-btn.accent { background: var(--klein); color: #fff; }

.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 0;
  font-size: 13px;
  color: var(--bone-2);
  border-bottom: 1px solid var(--line-2);
}
.link-btn:hover { color: var(--bone); border-color: var(--bone); }

.pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 100px;
  border: 1px solid var(--line-2);
  background: rgba(14, 15, 18, .5);
  backdrop-filter: blur(8px);
  font-size: 12px;
  white-space: nowrap;
}
.pill.accent { background: var(--klein); border-color: var(--klein); color: #fff; }

.pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px 7px 10px;
  border-radius: 100px;
  border: 1px solid var(--line-2);
  background: rgba(20, 22, 27, .72);
  backdrop-filter: blur(10px);
  font-size: 13px;
  color: var(--bone-2);
}
.pill-btn .ic { width: 16px; height: 16px; }
.pill-btn.on { background: var(--klein); border-color: var(--klein); color: #fff; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scrollable { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  padding: 6px 13px;
  border-radius: 100px;
  border: 1px solid var(--line-2);
  font-size: 13px;
  color: var(--bone-2);
  white-space: nowrap;
}
button.chip:hover { border-color: var(--bone-2); }
.chip.on { background: var(--klein); border-color: var(--klein); color: #fff; }

.row-btns { display: flex; gap: 10px; }
.row-btns .btn { flex: 1; }

/* ---------- screen chrome -------------------------------------- */
.scr-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 14px 8px;
  position: sticky;
  top: 0;
  background: linear-gradient(var(--ink) 68%, transparent);
  z-index: 20;
}
.scr-head-txt { flex: 1; min-width: 0; }
.scr-title {
  font-family: var(--display);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -.025em;
  line-height: 1.14;
}

.tabs { display: flex; gap: 4px; padding: 4px 18px 10px; border-bottom: 1px solid var(--line); }
.tab { padding: 8px 14px; border-radius: 100px; font-size: 14px; color: var(--ash); }
.tab.on { background: var(--ink-2); color: var(--bone); }

.empty { padding: 60px 26px; text-align: center; }
.empty-title { font-family: var(--display); font-size: 20px; font-weight: 700; }
.empty-sub { color: var(--ash); margin: 8px 0 20px; }

/* ============================================================
   Product imagery
   ============================================================ */
.shot-frame {
  display: grid;
  place-items: center;
  aspect-ratio: 1 / 1;
  border-radius: var(--r);
  background: linear-gradient(168deg, var(--paper), var(--paper-2));
  padding: 10%;
  overflow: hidden;
}
.shot-frame svg, .shot-frame .shot { width: 100%; height: 100%; }
.shot-photo { width: 100%; height: 100%; object-fit: contain; }

.tile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
}
.tile { display: flex; flex-direction: column; gap: 2px; }
.tile .shot-frame { margin-bottom: 8px; transition: transform .18s; }
.tile:hover .shot-frame { transform: translateY(-3px); }
.tile-brand { font-size: 12px; color: var(--ash); }
.tile-name { font-size: 14.5px; line-height: 1.3; }
.tile-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.tile-price { font-family: var(--mono); font-size: 13px; }
.tile-colour { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ash); }
.tile-colour i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line-2); }

/* ---------- credit line (the recurring device) ----------------- */
.credits { display: flex; flex-direction: column; }
.credit {
  display: grid;
  grid-template-columns: 46px 1fr auto auto;
  align-items: center;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.credit:last-child { border-bottom: 0; }
.credit-thumb {
  display: grid;
  place-items: center;
  width: 46px; height: 46px;
  border-radius: var(--r-sm);
  background: linear-gradient(165deg, var(--paper), var(--paper-2));
  padding: 4px;
  overflow: hidden;
}
.credit-thumb svg { width: 100%; height: 100%; }
.credit-main { min-width: 0; display: flex; flex-direction: column; }
.credit-cat {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ash-2);
}
.credit-name {
  font-size: 14.5px;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-bottom: 1px solid transparent;
}
.credit-name:hover { border-color: var(--bone-2); }
.credit-brand { font-size: 12px; color: var(--ash); }
.credit-price { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.credit-swap {
  display: grid; place-items: center;
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1px solid var(--line-2);
  color: var(--bone-2);
}
.credit-swap:hover { background: var(--klein); border-color: var(--klein); color: #fff; }
.credit-swap .ic { width: 17px; height: 17px; }

/* ---------- worn outfits --------------------------------------- */
.worn { width: 100%; height: 100%; }
.fit-layer { transition: opacity .2s; }
.layer-swap { animation: layerIn .42s cubic-bezier(.2, .8, .2, 1); }
@keyframes layerIn {
  from { opacity: 0; transform: translateY(-8px) scale(.985); }
  to { opacity: 1; transform: none; }
}

.look-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.look-thumb {
  flex: none;
  width: 132px;
  aspect-ratio: 9 / 15;
  border-radius: var(--r);
  overflow: hidden;
  position: relative;
  background: var(--studio);
  display: grid;
  place-items: end center;
  padding: 10px 6% 6px;
}
.look-cap {
  position: absolute;
  left: 8px; bottom: 8px;
  padding: 3px 8px;
  border-radius: 100px;
  background: rgba(14, 15, 18, .7);
  backdrop-filter: blur(6px);
  font-size: 11px;
}

/* ============================================================
   Welcome
   ============================================================ */
.wordmark {
  font-family: var(--display);
  font-weight: 800;
  letter-spacing: -.05em;
  line-height: .9;
  font-size: clamp(56px, 17vw, 96px);
}
.wordmark span { display: inline-block; width: .12em; }
.wordmark.sm { font-size: 14px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
.wordmark.sm span { width: .3em; }

.welcome {
  min-height: var(--vh);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  position: relative;
  overflow: hidden;
  background: radial-gradient(120% 70% at 50% 0%, #1E2130 0%, var(--ink) 60%), var(--ink);
}
.welcome-art { position: absolute; inset: 0 0 24% 0; pointer-events: none; }
.welcome-fig { position: absolute; bottom: 0; height: 100%; width: 66%; max-width: 340px; }
.welcome-fig svg { width: 100%; height: 100%; }
.welcome-fig.f1 { left: 50%; transform: translateX(-50%); z-index: 2; }
.welcome-fig.f0 { left: 50%; transform: translateX(-4%) scale(.72); transform-origin: bottom left; opacity: .4; filter: blur(1.5px); }
.welcome-fig.f2 { right: 50%; transform: translateX(4%) scale(.72); transform-origin: bottom right; opacity: .4; filter: blur(1.5px); }

.welcome-body {
  position: relative;
  z-index: 3;
  padding: 34px 22px calc(38px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: linear-gradient(transparent, var(--ink) 22%);
}
.lede { color: var(--bone-2); font-size: 16.5px; max-width: 42ch; margin-bottom: 8px; }

/* ============================================================
   Quiz
   ============================================================ */
.quiz {
  min-height: var(--vh);
  display: flex;
  flex-direction: column;
  background: radial-gradient(80% 50% at 80% 0%, rgba(58, 52, 232, .18), transparent 70%), var(--ink);
}
.quiz-top { display: flex; align-items: center; gap: 12px; padding: 14px 12px; }
.quiz-progress { flex: 1; height: 2px; background: var(--line-2); position: relative; }
.quiz-progress span {
  position: absolute; inset: 0 auto 0 0;
  background: var(--klein-2);
  transition: width .35s cubic-bezier(.2, .8, .2, 1);
}
.quiz-stage { flex: 1; display: flex; align-items: center; padding: 0 20px 40px; }
.q { width: 100%; animation: rise .38s cubic-bezier(.2, .8, .2, 1); }
.q-title {
  font-family: var(--display);
  font-size: clamp(28px, 7.6vw, 40px);
  font-weight: 700;
  letter-spacing: -.03em;
  line-height: 1.08;
  margin: 10px 0 26px;
  max-width: 18ch;
}
.q-options { display: flex; flex-direction: column; gap: 9px; }
.q-option {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 15px 17px;
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  text-align: left;
  font-size: 16px;
  line-height: 1.3;
  transition: border-color .16s, background .16s, transform .12s;
}
.q-option:hover { border-color: var(--bone-2); }
.q-option:active { transform: scale(.99); }
.q-mark {
  width: 15px; height: 15px;
  border: 1px solid var(--line-2);
  border-radius: 50%;
  flex: none;
  transition: background .16s, border-color .16s, box-shadow .16s;
}
.q-option.on { border-color: var(--klein-2); background: var(--klein-dim); }
.q-option.on .q-mark { background: var(--klein-2); border-color: var(--klein-2); box-shadow: inset 0 0 0 3px var(--ink); }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ============================================================
   Style DNA
   ============================================================ */
.dna-hero { background: var(--klein); color: #fff; padding: 60px 22px 42px; }
.dna-hero .kicker { color: rgba(255, 255, 255, .72); }
.dna-name {
  font-family: var(--display);
  font-size: clamp(38px, 10vw, 60px);
  font-weight: 800;
  letter-spacing: -.045em;
  line-height: 1.02;
  margin: 10px 0 12px;
}
.dna-line { font-size: 17px; max-width: 34ch; color: rgba(255, 255, 255, .88); }
.dna-body { padding: 4px 18px 40px; }
.dna-cta { display: flex; flex-direction: column; gap: 10px; margin-top: 30px; }

.axes { display: flex; flex-direction: column; gap: 9px; }
.axis { display: grid; grid-template-columns: 96px 1fr 32px; align-items: center; gap: 10px; }
.axis-label { font-size: 13.5px; color: var(--bone-2); }
.axis-track { height: 3px; background: var(--line-2); position: relative; }
.axis-fill { position: absolute; inset: 0 auto 0 0; background: var(--bone); }
.axis-val { font-family: var(--mono); font-size: 11px; color: var(--ash); text-align: right; font-variant-numeric: tabular-nums; }
.dna-card .axis-fill { background: var(--klein-2); }

/* ============================================================
   Feed
   ============================================================ */
.feed { height: var(--vh); position: relative; }

.feed-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 16px 14px;
  background: linear-gradient(rgba(14, 15, 18, .85), transparent);
  pointer-events: none;
}
.feed-top > * { pointer-events: auto; }
.feed-top-actions { display: flex; gap: 7px; }

.feed-scroll {
  height: 100%;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
  outline: none;
}
.feed-scroll::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  height: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  overflow: hidden;
  background: var(--studio);
  isolation: isolate;
}
.card-stage {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: end center;
  padding: 20px 16% 36%;
}
.card-stage svg { width: 100%; height: 100%; }
.card-veil {
  position: absolute;
  inset: 0;
  background: linear-gradient(transparent 38%, rgba(10, 11, 13, .42) 62%, rgba(10, 11, 13, .92) 84%);
  pointer-events: none;
}

.card-rail {
  position: absolute;
  right: 10px;
  bottom: 32%;
  display: flex;
  flex-direction: column;
  gap: 14px;
  z-index: 5;
}
.rail-btn {
  display: grid;
  place-items: center;
  width: 46px; height: 46px;
  border-radius: 50%;
  background: rgba(14, 15, 18, .44);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(242, 239, 233, .14);
  color: var(--bone);
  transition: transform .16s, background .16s, color .16s;
}
.rail-btn:hover { background: rgba(14, 15, 18, .74); }
.rail-btn:active { transform: scale(.9); }
.rail-btn.liked { color: var(--flame); border-color: rgba(255, 92, 66, .5); }
.rail-btn.saved { color: var(--klein-2); border-color: rgba(91, 86, 245, .55); }

.card-info {
  position: absolute;
  left: 0; right: 66px; bottom: 0;
  z-index: 4;
  padding: 0 16px 22px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.card-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.card-hero { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--bone-2); }
.card-title {
  font-family: var(--display);
  font-size: clamp(23px, 6.4vw, 30px);
  font-weight: 700;
  letter-spacing: -.03em;
  line-height: 1.06;
}
.card-why {
  font-size: 14px;
  line-height: 1.45;
  color: var(--bone-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  max-width: 48ch;
}
.card-credits { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
.card-credits .credit-thumb { background: rgba(239, 235, 227, .9); }

.burst {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
  opacity: 0;
  z-index: 6;
}
.burst .ic { width: 116px; height: 116px; color: var(--flame); }
.burst.go { animation: burst .78s cubic-bezier(.2, .8, .2, 1); }
@keyframes burst {
  0% { opacity: 0; transform: scale(.4) rotate(-12deg); }
  22% { opacity: 1; transform: scale(1.08) rotate(4deg); }
  55% { opacity: 1; transform: scale(.98); }
  100% { opacity: 0; transform: scale(1.3); }
}

/* ============================================================
   Outfit page
   ============================================================ */
.outfit-grid { padding: 0 18px 40px; }
.outfit-stage {
  position: relative;
  aspect-ratio: 9 / 14;
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--studio);
  margin-bottom: 18px;
  padding: 22px 12% 62px;
  display: grid;
  place-items: end center;
}
.outfit-stage svg { width: 100%; height: 100%; }
.stage-note {
  position: absolute;
  left: 12px; right: 12px; bottom: 12px;
  padding: 8px 12px;
  border-radius: var(--r-sm);
  background: rgba(14, 15, 18, .7);
  backdrop-filter: blur(8px);
  font-size: 11px;
  line-height: 1.4;
  color: var(--bone-2);
}
.outfit-actions { display: flex; gap: 8px; margin-bottom: 16px; }
.outfit-actions .btn { flex: 1; padding-inline: 10px; font-size: 14px; }
.outfit-actions .ic { width: 18px; height: 18px; }
.why-block {
  padding: 15px 16px;
  border-left: 2px solid var(--klein-2);
  background: var(--ink-1);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 14.5px;
  line-height: 1.5;
  color: var(--bone-2);
  min-height: 54px;
}
.side-head { display: flex; align-items: baseline; justify-content: space-between; }
.side-head .sec-title { margin-bottom: 8px; }
.outfit-side .btn-ghost.full { margin-top: 14px; }

.alt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
.alt {
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
}
.alt-shot {
  display: grid;
  place-items: center;
  aspect-ratio: 1 / 1;
  border-radius: var(--r-sm);
  background: linear-gradient(165deg, var(--paper), var(--paper-2));
  padding: 8%;
  margin-bottom: 6px;
  transition: transform .16s;
}
.alt:hover .alt-shot { transform: translateY(-3px); }
.alt-shot svg { width: 100%; height: 100%; }
.alt-shot .ic { width: 26px; height: 26px; color: var(--ash-2); }
.alt-name { font-size: 13px; line-height: 1.25; }
.alt-meta { font-size: 11px; color: var(--ash); }
.alt-remove .alt-shot { background: var(--ink-2); }

/* ============================================================
   Product page
   ============================================================ */
.product-grid { padding: 0 18px; }
.product-hero {
  display: grid;
  place-items: center;
  aspect-ratio: 1 / 1;
  border-radius: var(--r-lg);
  background: linear-gradient(168deg, var(--paper), var(--paper-2));
  padding: 8%;
  overflow: hidden;
}
.product-hero svg, .product-hero img { width: 100%; height: 100%; }
.product-thumbs { display: flex; gap: 10px; margin: 12px 0 22px; }
.pthumb {
  width: 70px; height: 70px;
  border-radius: var(--r-sm);
  overflow: hidden;
  padding: 6px;
  background: linear-gradient(165deg, var(--paper), var(--paper-2));
  border: 2px solid transparent;
  display: grid;
  place-items: center;
}
.pthumb svg { width: 100%; height: 100%; }
.pthumb.on { border-color: var(--klein-2); }
.pthumb .worn { background: var(--studio); border-radius: 4px; }

.product-brand { font-size: 13px; color: var(--ash); letter-spacing: .04em; }
.product-name {
  font-family: var(--display);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -.025em;
  line-height: 1.14;
  margin: 4px 0 8px;
}
.product-colour { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--bone-2); }
.product-colour i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line-2); }
.product-price { font-size: 24px; margin: 14px 0 4px; }

.size-block { margin: 22px 0 18px; }
.size-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 10px; }
.sizes { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.size {
  padding: 12px 4px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  font-size: 14px;
  text-align: center;
  transition: border-color .16s, background .16s;
}
.size:hover { border-color: var(--bone-2); }
.size.on { border-color: var(--bone); background: var(--ink-2); }

.product-actions { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

.specs { margin: 8px 0 18px; display: grid; }
.specs > div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.specs dt { color: var(--ash); font-size: 13.5px; }
.specs dd { margin: 0; font-size: 14.5px; text-align: right; }

.fabric { width: 100%; height: 100%; border-radius: 4px; }

/* ============================================================
   Shop
   ============================================================ */
.search-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 4px 18px 8px;
  padding: 11px 15px;
  border-radius: 100px;
  background: var(--ink-1);
  border: 1px solid var(--line);
  color: var(--ash);
}
.search-bar input { flex: 1; background: none; border: 0; outline: none; font-size: 15px; color: var(--bone); }
.search-bar input::placeholder { color: var(--ash-2); }

.filters { padding: 8px 18px 0; display: flex; flex-direction: column; gap: 22px; }
.filter-block h3 {
  font-family: var(--display);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--bone-2);
  margin-bottom: 10px;
}
.filter-head { display: flex; align-items: baseline; justify-content: space-between; }
.filter-head h3 { margin-bottom: 8px; }
.filter-head span { color: var(--ash); }

input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 22px;
  background: none;
  cursor: pointer;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-2); }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-2); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  margin-top: -8px;
  border-radius: 50%;
  background: var(--bone);
  border: 4px solid var(--klein);
}
input[type=range]::-moz-range-thumb {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--bone);
  border: 4px solid var(--klein);
}

.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px 5px 6px;
  border-radius: 100px;
  border: 1px solid var(--line-2);
}
.swatch span { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .4); }
.swatch em { font-style: normal; font-size: 13px; color: var(--bone-2); }
.swatch.on { border-color: var(--bone); background: var(--ink-2); }

/* ============================================================
   Community
   ============================================================ */
.posts { display: flex; flex-direction: column; }
.post { padding: 16px 0 20px; border-bottom: 1px solid var(--line); }
.post-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 18px 12px; }
.post-user { display: flex; align-items: center; gap: 10px; min-width: 0; }
.post-av, .comment-av, .thread-av, .chat-av, .prof-av {
  display: block;
  border-radius: 50%;
  overflow: hidden;
  background: var(--ink-3);
  flex: none;
}
.post-av { width: 38px; height: 38px; }
.post-av svg, .comment-av svg, .thread-av svg, .chat-av svg, .prof-av svg { width: 100%; height: 100%; }
.post-user strong { display: block; font-size: 14.5px; font-weight: 600; }
.post-user em { font-style: normal; font-size: 12px; color: var(--ash); }

.post-img {
  display: grid;
  place-items: end center;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  padding: 20px 0 14px;
  background: var(--studio);
}
.post-img svg { width: 100%; height: 100%; }

.post-actions { display: flex; gap: 6px; padding: 12px 18px 8px; }
.post-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 100px;
  border: 1px solid var(--line);
  font-size: 13px;
  color: var(--bone-2);
}
.post-btn .ic { width: 18px; height: 18px; }
.post-btn.liked { color: var(--flame); border-color: rgba(255, 92, 66, .4); }
.post-btn.ref { margin-left: auto; border-color: var(--line-2); }
.post-btn.ref:hover { background: var(--klein); border-color: var(--klein); color: #fff; }
.post-caption { padding: 0 18px; font-size: 14.5px; color: var(--bone-2); }
.post-caption strong { color: var(--bone); font-weight: 600; margin-right: 5px; }

.comments { display: flex; flex-direction: column; gap: 12px; }
.comment { display: flex; gap: 10px; align-items: flex-start; }
.comment-av { width: 30px; height: 30px; }
.comment p { font-size: 14px; color: var(--bone-2); }
.comment strong { color: var(--bone); font-weight: 600; margin-right: 4px; }
.comment-form { display: flex; gap: 8px; margin: 16px 0 30px; }
.comment-form input, .chat-form input {
  flex: 1;
  padding: 12px 16px;
  border-radius: 100px;
  border: 1px solid var(--line-2);
  background: var(--ink-1);
  outline: none;
  font-size: 15px;
}
.comment-form input:focus, .chat-form input:focus { border-color: var(--klein-2); }

/* ---------- profiles ------------------------------------------ */
.prof-head { display: flex; align-items: center; gap: 18px; padding: 8px 18px 14px; }
.prof-av { width: 74px; height: 74px; }
.prof-stats { flex: 1; display: flex; justify-content: space-around; text-align: center; }
.prof-stats strong { display: block; font-size: 17px; }
.prof-stats span { font-size: 11.5px; color: var(--ash); }
.prof-bio { padding: 0 18px; color: var(--bone-2); font-size: 14.5px; }
.prof-actions { display: flex; gap: 9px; padding: 16px 18px 4px; }
.prof-actions .btn { flex: 1; }

.dna-card {
  display: block;
  margin: 6px 18px 18px;
  padding: 18px;
  border-radius: var(--r-lg);
  background: linear-gradient(150deg, #24232F, var(--ink-1));
  border: 1px solid var(--line);
}
.dna-card strong {
  display: block;
  font-family: var(--display);
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -.03em;
  line-height: 1.2;
  margin: 6px 0 4px;
}
.dna-card em { display: block; font-style: normal; font-size: 14px; color: var(--ash); margin-bottom: 16px; }

.menu { display: flex; flex-direction: column; padding: 0 18px; }
.menu-row {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  padding: 15px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 15px;
  text-align: left;
}
.menu-row span { flex: 1; }
.menu-row em { font-style: normal; color: var(--ash); font-size: 12px; }
.menu-row .ic { color: var(--ash); }

.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.grid-cell {
  display: grid;
  place-items: end center;
  position: relative;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  border-radius: var(--r-sm);
  background: var(--studio);
  padding: 8px 4% 4px;
}
.grid-cell.tall { aspect-ratio: 9 / 14; border-radius: var(--r); }
.grid-cell svg { width: 100%; height: 100%; }
.grid-cap {
  position: absolute;
  left: 8px; bottom: 8px;
  padding: 3px 8px;
  border-radius: 100px;
  background: rgba(14, 15, 18, .7);
  backdrop-filter: blur(6px);
  font-size: 11px;
}

.bag-total {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 18px 0 4px;
  border-top: 1px solid var(--line-2);
  margin-top: 12px;
  font-size: 15px;
}
.bag-total strong { font-size: 20px; }

/* ============================================================
   Messages
   ============================================================ */
.thread-list { display: flex; flex-direction: column; padding: 0 18px; }
.thread-row {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.thread-av { width: 46px; height: 46px; position: relative; }
.thread-av .badge { top: 0; right: 0; }
.thread-txt { flex: 1; min-width: 0; }
.thread-txt strong { display: block; font-size: 15px; font-weight: 600; }
.thread-txt em {
  display: block;
  font-style: normal;
  font-size: 13px;
  color: var(--ash);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat { display: flex; flex-direction: column; height: var(--vh); }
.chat-head { display: flex; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
.chat-user { display: flex; align-items: center; gap: 10px; }
.chat-av { width: 38px; height: 38px; }
.chat-user strong { display: block; font-size: 15px; font-weight: 600; }
.chat-user em { font-style: normal; font-size: 12px; color: var(--ash); }

.bubbles { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.bubble {
  max-width: 74%;
  padding: 10px 15px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.35;
  animation: rise .24s ease-out;
}
.bubble.them { align-self: flex-start; background: var(--ink-2); border-bottom-left-radius: 5px; }
.bubble.me { align-self: flex-end; background: var(--klein); color: #fff; border-bottom-right-radius: 5px; }
.bubble.typing { display: flex; gap: 4px; padding: 14px 16px; }
.bubble.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--ash); animation: blink 1.1s infinite; }
.bubble.typing span:nth-child(2) { animation-delay: .18s; }
.bubble.typing span:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }

.chat-form {
  display: flex;
  gap: 8px;
  padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
}

/* ============================================================
   Studio
   ============================================================ */
.studio-grid { padding: 0 18px 40px; }
.studio-preview {
  aspect-ratio: 9 / 13;
  max-height: 46vh;
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--studio);
  padding: 18px 10% 12px;
  display: grid;
  place-items: end center;
  margin-bottom: 20px;
}
.studio-preview svg { width: 100%; height: 100%; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field > span { font-size: 12.5px; color: var(--ash); display: flex; justify-content: space-between; }
.field > span em { font-style: normal; color: var(--bone-2); }
.field input:not([type=range]), .field textarea {
  padding: 11px 14px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line-2);
  background: var(--ink-1);
  outline: none;
  font-size: 15px;
}
.field input:focus, .field textarea:focus { border-color: var(--klein-2); }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }

.swatch-row { display: flex; flex-wrap: wrap; gap: 8px; }
.tone {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 2px solid transparent;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3);
}
.tone.on { border-color: var(--bone); }

.photo-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.photo-slot {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  aspect-ratio: 3 / 4;
  border: 1px dashed var(--line-2);
  border-radius: var(--r);
  color: var(--ash);
  cursor: pointer;
  overflow: hidden;
  background: var(--ink-1);
}
.photo-slot:hover { border-color: var(--bone-2); }
.photo-slot span { font-size: 10.5px; }
.photo-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo-slot.has span {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 3px;
  text-align: center;
  background: rgba(14, 15, 18, .76);
  color: var(--bone);
}
.photo-clear {
  position: absolute;
  top: 4px; right: 4px;
  width: 24px; height: 24px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(14, 15, 18, .8);
  z-index: 2;
}
.photo-clear .ic { width: 13px; height: 13px; }

.switch { display: flex; align-items: center; gap: 11px; margin: 20px 0 4px; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--klein); }

/* ============================================================
   Sheet & toast
   ============================================================ */
#sheet { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
#sheet.open { pointer-events: auto; }
.sheet-scrim {
  position: absolute;
  inset: 0;
  background: rgba(6, 7, 9, .68);
  backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity .22s;
}
#sheet.open .sheet-scrim { opacity: 1; }
.sheet-panel {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  max-height: var(--vh88);
  display: flex;
  flex-direction: column;
  padding: 6px 18px calc(24px + env(safe-area-inset-bottom));
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  background: var(--ink-1);
  border-top: 1px solid var(--line-2);
  box-shadow: var(--shadow);
  transform: translateY(100%);
  transition: transform .28s cubic-bezier(.2, .8, .2, 1);
}
#sheet.open .sheet-panel { transform: none; }
.sheet-panel::before {
  content: '';
  width: 38px; height: 4px;
  border-radius: 100px;
  background: var(--line-2);
  margin: 6px auto 4px;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
.sheet-title { font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.sheet-sub { font-size: 13.5px; color: var(--ash); margin-bottom: 12px; max-width: 52ch; }
.sheet-body { overflow-y: auto; padding-bottom: 4px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + 18px);
  transform: translate(-50%, 20px);
  z-index: 70;
  max-width: min(90vw, 420px);
  padding: 11px 18px;
  border-radius: 100px;
  background: var(--bone);
  color: var(--ink);
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .24s cubic-bezier(.2, .8, .2, 1);
  box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ============================================================
   Tablet — centre the column instead of stretching the phone
   ============================================================ */
@media (min-width: 560px) and (max-width: 899px) {
  html, body { background: #08090B; }
  .app {
    max-width: 560px;
    margin: 0 auto;
    background: var(--ink);
    box-shadow: 0 0 0 1px var(--line), 0 0 80px rgba(0, 0, 0, .6);
  }
  .nav { left: 50%; right: auto; transform: translateX(-50%); width: 100%; max-width: 560px; }
}

/* ============================================================
   Desktop — the feed becomes a lookbook spread
   ============================================================ */
@media (min-width: 900px) {
  .nav {
    top: 0; right: auto;
    width: var(--rail-w);
    height: var(--vh);
    grid-template-columns: 1fr;
    grid-auto-rows: max-content;
    align-content: center;
    gap: 6px;
    padding: 0;
    border-top: 0;
    border-right: 1px solid var(--line);
  }
  .nav-item { padding: 13px 4px; }
  .nav-item.on::before { top: 50%; left: 0; transform: translateY(-50%); width: 2px; height: 26px; }
  .badge { top: 9px; right: calc(50% - 15px); }

  .app.with-nav { padding-left: var(--rail-w); }
  .app.with-nav .screen { padding-bottom: 0; }
  .screen { max-width: 1040px; margin: 0 auto; }
  .toast { bottom: 26px; left: calc(50% + var(--rail-w) / 2); }

  .card { display: grid; place-items: center; background: var(--ink); }
  .card-stage {
    position: relative;
    inset: auto;
    width: min(420px, 42vw);
    aspect-ratio: 9 / 15;
    max-height: var(--vh88);
    border-radius: var(--r-lg);
    overflow: hidden;
    background: var(--studio);
    box-shadow: var(--shadow);
    padding: 26px 8% 22px;
  }
  .card-veil {
    inset: auto;
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(420px, 42vw);
    aspect-ratio: 9 / 15;
    max-height: var(--vh88);
    border-radius: var(--r-lg);
  }
  .card-info {
    left: 50%;
    right: auto;
    bottom: 50%;
    transform: translate(calc(min(420px, 42vw) / 2 + 26px), 50%);
    width: min(360px, 30vw);
    padding: 0;
  }
  .card-rail {
    right: auto;
    left: 50%;
    bottom: 50%;
    transform: translate(calc(-1 * min(420px, 42vw) / 2 - 66px), 50%);
  }

  .outfit-grid, .product-grid, .studio-grid {
    display: grid;
    grid-template-columns: minmax(0, 440px) minmax(0, 1fr);
    gap: 34px;
    align-items: start;
    padding-inline: 40px;
  }
  .outfit-stage, .studio-preview { position: sticky; top: 84px; }
  .studio-preview { max-height: none; margin-bottom: 0; }

  .dna-body, .filters, .pad, .menu, .prof-bio { padding-inline: 40px; }
  .scr-head, .tabs, .post-head, .post-actions, .post-caption, .prof-head, .prof-actions, .thread-list { padding-inline: 40px; }
  .search-bar { margin-inline: 40px; }
  .welcome-body { padding: 44px 40px 60px; }
  .dna-hero { padding: 76px 40px 56px; }

  .sheet-panel {
    left: 50%;
    right: auto;
    bottom: 50%;

    s.ankleY = top + H * 7.58;

    /* Widths are set against the head, the way a croquis is
       measured: shoulders about two heads across, waist a little
       over one, hips between the two. */
    s.neckHalf = 17 + build * 4;
    s.shoulderHalf = 74 + frame * 20 + build * 16;
    s.bustHalf = 62 + frame * 8 + build * 18;
    s.waistHalf = 41 + build * 28 + frame * 8;
    s.hipHalf = 78 - frame * 10 + build * 22;
    s.thighHalf = 39 + build * 16;
    s.kneeHalf = 26 + build * 7;
    s.calfHalf = 30 + build * 9;
    s.ankleHalf = 16 + build * 3;
    s.upperArmW = 18 + build * 7;
    s.forearmW = 14 + build * 5;

    s.hideBriefs = !!look.hideBriefs;
    s.hideBand = !!look.hideBand;

    /* Lean: shoulders drift away from the weight-bearing hip. */
    s.shoulderOff = -sway * 0.42;
    s.waistOff = sway * 0.15;
    s.hipOff = sway;

    /* Legs. Right (viewer's right, +x) carries the weight and runs
       almost straight; the left is released, knee closer in. */
    s.legs = {
      right: {
        hip: pt(cx + sway + s.hipHalf * 0.44, s.crotchY - 34),
        knee: pt(cx + sway + 24, s.kneeY),
        ankle: pt(cx + sway + 17, s.ankleY),
        inner: pt(cx + sway + 5, s.crotchY)
      },
      left: {
        hip: pt(cx + sway - s.hipHalf * 0.48, s.crotchY - 34),
        knee: pt(cx + sway - 33, s.kneeY - 8),
        ankle: pt(cx + sway - 44, s.ankleY + 4),
        inner: pt(cx + sway - 5, s.crotchY)
      }
    };

    /* Arms hang with a small gap and a soft elbow break. The
       shoulder joint sits inside the deltoid so the arm grows out
       of the torso instead of being parked next to it. */
    function arm(sign, extra) {
      var sx = cx + s.shoulderOff + sign * (s.shoulderHalf - s.upperArmW * 0.95);
      return {
        shoulder: pt(sx, s.shoulderY + 20),
        elbow: pt(cx + sign * (s.shoulderHalf + 6 + extra), s.waistY + 22),
        wrist: pt(cx + sign * (s.shoulderHalf + 1 + extra * 0.4), s.crotchY + 26),
        hand: pt(cx + sign * (s.shoulderHalf + extra * 0.3), s.crotchY + 80)
      };
    }
    s.arms = { left: arm(-1, 2), right: arm(1, 7) };

    return s;
  };

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* ---------- path helpers ------------------------------------- */
  function P() {
    var d = '';
    var api = {
      M: function (x, y) { d += 'M' + r(x) + ' ' + r(y); return api; },
      L: function (x, y) { d += 'L' + r(x) + ' ' + r(y); return api; },
      C: function (a, b, c, e, f, g) { d += 'C' + r(a) + ' ' + r(b) + ' ' + r(c) + ' ' + r(e) + ' ' + r(f) + ' ' + r(g); return api; },
      Q: function (a, b, c, e) { d += 'Q' + r(a) + ' ' + r(b) + ' ' + r(c) + ' ' + r(e); return api; },
      Z: function () { d += 'Z'; return api; },
      d: function () { return d; }
    };
    return api;
  }
  function r(v) { return Math.round(v * 10) / 10; }
  SM.P = P;

  /* A tapered limb: a closed outline from joint to joint so the
     silhouette narrows the way a real arm or leg does. */
  function limb(a, b, c, wA, wB, wC) {
    var p = P();
    p.M(a.x - wA, a.y);
    p.C(a.x - wA - 2, a.y + (b.y - a.y) * 0.4, b.x - wB - 3, b.y - (b.y - a.y) * 0.35, b.x - wB, b.y);
    p.C(b.x - wB - 1, b.y + (c.y - b.y) * 0.4, c.x - wC - 2, c.y - (c.y - b.y) * 0.3, c.x - wC, c.y);
    p.L(c.x + wC, c.y);
    p.C(c.x + wC + 2, c.y - (c.y - b.y) * 0.3, b.x + wB + 1, b.y + (c.y - b.y) * 0.4, b.x + wB, b.y);
    p.C(b.x + wB + 3, b.y - (b.y - a.y) * 0.35, a.x + wA + 2, a.y + (b.y - a.y) * 0.4, a.x + wA, a.y);
    p.Z();
    return p.d();
  }
  SM.figure.limbPath = limb;

  /* ============================================================
     Skin
     ============================================================ */
  SM.SKIN_TONES = [
    { key: 'porcelain', hex: '#F6DFCB' },
    { key: 'fair',      hex: '#EFCDAE' },
    { key: 'light',     hex: '#E3B48D' },
    { key: 'olive',     hex: '#CE9A6E' },
    { key: 'tan',       hex: '#B27B50' },
    { key: 'brown',     hex: '#8E5A34' },
    { key: 'deep',      hex: '#6A3F24' },
    { key: 'rich',      hex: '#4B2A18' }
  ];

  SM.HAIR_COLOURS = [
    { key: 'black',    hex: '#171310' },
    { key: 'darkBrown',hex: '#2E1F16' },
    { key: 'brown',    hex: '#4E3220' },
    { key: 'auburn',   hex: '#6E3320' },
    { key: 'blonde',   hex: '#B98B4E' },
    { key: 'platinum', hex: '#D8C8AC' },
    { key: 'grey',     hex: '#8B8880' },
    { key: 'dyed',     hex: '#3A34E8' }
  ];

  SM.HAIR_STYLES = ['short', 'buzz', 'bob', 'long', 'curly', 'bun'];

  function skinPaint(paint, skin) {
    return {
      arm: paint.cylinder(skin),
      armFar: paint.cylinder(shade(skin, -0.13), { flip: true }),
      leg: paint.cylinder(skin),
      legFar: paint.cylinder(shade(skin, -0.10)),
      torso: paint.cylinder(skin),
      neck: paint.cylinder(shade(skin, -0.16)),
      head: paint.cylinder(skin)
    };
  }

  /* ---------- legs, torso, arms -------------------------------- */
  SM.figure.body = function (s, look, paint) {
    var skin = look.skin || '#E3B48D';
    var g = skinPaint(paint, skin);
    var out = '';

    /* Every shading mark is clipped to the form it belongs to.
       An unclipped soft ellipse leaks past the silhouette and
       reads as a hard band floating next to the body. */
    function shaded(d, fill, marks) {
      return '<path d="' + d + '" fill="' + fill + '"/>' +
        '<g clip-path="url(#' + paint.clip(d) + ')">' + marks + '</g>';
    }

    /* --- legs (far leg first so it sits behind) --- */
    var L = s.legs.left, R = s.legs.right;
    var farLeg = limb(L.hip, L.knee, L.ankle, s.thighHalf * 0.92, s.kneeHalf, s.ankleHalf);
    var nearLeg = limb(R.hip, R.knee, R.ankle, s.thighHalf, s.kneeHalf, s.ankleHalf);

    out += foot(s, L, -1, shade(skin, -0.1));
    out += shaded(farLeg, g.legFar,
      softMark(paint, L.hip.x + 4, L.hip.y + 96, s.thighHalf * 0.55, 96, warm(skin, 0.08), 0.3) +
      softMark(paint, L.knee.x - 3, L.knee.y - 4, s.kneeHalf * 0.8, 20, shade(skin, -0.2), 0.4));

    out += foot(s, R, 1, skin);
    out += shaded(nearLeg, g.leg,
      /* quadriceps sweep, knee cap, calf swell */
      softMark(paint, R.hip.x - 6, R.hip.y + 96, s.thighHalf * 0.6, 104, warm(skin, 0.13), 0.38) +
      softMark(paint, R.knee.x + 3, R.knee.y - 4, s.kneeHalf * 0.85, 22, shade(skin, -0.17), 0.42) +
      softMark(paint, R.ankle.x + 7, s.calfY, s.calfHalf * 0.6, 56, warm(skin, 0.11), 0.32));

    /* --- arms, drawn before the torso so the shoulder joint is
       covered by the chest. Overlap is what reads as attachment;
       a cap drawn on top always looks like a puffed sleeve. --- */
    function drawArm(a, sign, fill, tone) {
      var armD = limb(a.shoulder, a.elbow, a.wrist, s.upperArmW, s.forearmW + 2, s.forearmW - 2);
      return shaded(armD, fill,
        softMark(paint, a.elbow.x - sign * 5, a.elbow.y, s.forearmW * 0.7, 30, shade(tone, -0.2), 0.4)) +
        hand(s, a, sign, tone, paint);
    }
    out += drawArm(s.arms.left, -1, g.armFar, shade(skin, -0.08));
    out += drawArm(s.arms.right, 1, g.arm, skin);

    /* --- torso --- */
    var torsoD = torsoPath(s);
    var cxS = s.cx + s.shoulderOff;
    var torsoMarks =
      softMark(paint, cxS + s.bustHalf * 0.66, s.bustY + 60, s.bustHalf * 0.5, 140, cool(skin, -0.22), 0.5) +
      softMark(paint, cxS - s.bustHalf * 0.28, s.bustY + 30, s.bustHalf * 0.44, 120, warm(skin, 0.12), 0.32) +
      softMark(paint, s.cx + s.waistOff + 3, s.waistY + 30, 7, 11, shade(skin, -0.32), 0.45);
    /* Collarbones: barely there, but they place the shoulders. */
    [-1, 1].forEach(function (sign) {
      torsoMarks += '<path d="' + P()
        .M(cxS + sign * (s.neckHalf + 6), s.neckBase + 2)
        .Q(cxS + sign * (s.shoulderHalf * 0.52), s.neckBase + 16, cxS + sign * (s.shoulderHalf * 0.76), s.neckBase + 10).d() +
        '" fill="none" stroke="' + shade(skin, -0.26) + '" stroke-opacity=".28" stroke-width="2.6" stroke-linecap="round"/>';
    });
    out += shaded(torsoD, g.torso, torsoMarks);

    /* --- base layer -------------------------------------------
       A plain briefs (and bandeau on a narrower frame) so the
       undressed figure is presentable in the studio, and so the
       pelvis reads as a body rather than an odd pale wedge. */
    if (!look.bare) {
      out += '<g clip-path="url(#' + paint.clip(torsoD) + ')">' + baseLayer(s, paint, skin) + '</g>';
    }

    return out;
  };

  function baseLayer(s, paint, skin) {
    var cxH = s.cx + s.hipOff, hi = s.hipHalf;
    /* Keyed off the skin so it stays a quiet undergarment rather
       than a bright white band across the figure. */
    var cloth = mix(skin, '#EFE9E1', 0.62);
    var briefs = P()
      .M(cxH - hi - 2, s.hipY - 4)
      .C(cxH - hi + 3, s.crotchY - 42, cxH - hi * 0.70, s.crotchY - 12, cxH - 8, s.crotchY + 14)
      .C(cxH - 4, s.crotchY + 4, cxH + 4, s.crotchY + 4, cxH + 8, s.crotchY + 14)
      .C(cxH + hi * 0.70, s.crotchY - 12, cxH + hi - 3, s.crotchY - 42, cxH + hi + 2, s.hipY - 4)
      .C(cxH + hi * 0.5, s.hipY - 18, cxH - hi * 0.5, s.hipY - 18, cxH - hi - 2, s.hipY - 4)
      .Z().d();
    var out = s.hideBriefs ? '' : '<path d="' + briefs + '" fill="' + paint.cylinder(cloth) + '"/>';
    if (s.frame < 0.55 && !s.hideBand) {
      var cxS = s.cx + s.shoulderOff, bu = s.bustHalf;
      out += '<path d="' + P()
        .M(cxS - bu - 2, s.bustY + 26)
        .C(cxS - bu * 0.4, s.bustY + 52, cxS + bu * 0.4, s.bustY + 52, cxS + bu + 2, s.bustY + 26)
        .L(cxS + bu + 2, s.bustY + 66)
        .C(cxS + bu * 0.4, s.bustY + 84, cxS - bu * 0.4, s.bustY + 84, cxS - bu - 2, s.bustY + 66)
        .Z().d() + '" fill="' + paint.cylinder(cloth) + '"/>';
    }

  }

  /* Torso outline, read from the top down: trapezius sloping out of
     the neck, deltoid cap, armpit, ribcage tapering to the waist,
     flare over the hips, then an inverted V at the crotch. Skipping
     the trapezius slope is what makes a drawn torso look like a
     rectangle with a head on it. */
  function torsoPath(s) {
    var cxS = s.cx + s.shoulderOff, cxW = s.cx + s.waistOff, cxH = s.cx + s.hipOff;
    var sh = s.shoulderHalf, bu = s.bustHalf, wa = s.waistHalf, hi = s.hipHalf;
    var nh = s.neckHalf, nb = s.neckBase, shY = s.shoulderY;
    return P()
      .M(cxS - nh - 3, nb - 16)
      .C(cxS - nh - 20, nb - 4, cxS - sh + 18, shY - 6, cxS - sh, shY + 24)
      .C(cxS - sh - 4, shY + 40, cxS - bu - 14, s.armpitY - 16, cxS - bu, s.bustY + 14)
      .C(cxW - bu + 5, s.waistY - 62, cxW - wa - 3, s.waistY - 28, cxW - wa, s.waistY + 6)
      .C(cxH - wa - 9, s.waistY + 48, cxH - hi + 5, s.hipY - 32, cxH - hi, s.hipY + 12)
      .C(cxH - hi + 3, s.crotchY - 42, cxH - hi * 0.70, s.crotchY - 12, cxH - 8, s.crotchY + 12)
      .C(cxH - 4, s.crotchY + 2, cxH + 4, s.crotchY + 2, cxH + 8, s.crotchY + 12)
      .C(cxH + hi * 0.70, s.crotchY - 12, cxH + hi - 3, s.crotchY - 42, cxH + hi, s.hipY + 12)
      .C(cxH + hi - 5, s.hipY - 32, cxW + wa + 9, s.waistY + 48, cxW + wa, s.waistY + 6)
      .C(cxW + wa + 3, s.waistY - 28, cxS + bu - 5, s.waistY - 62, cxS + bu, s.bustY + 14)
      .C(cxS + bu + 14, s.armpitY - 16, cxS + sh + 4, shY + 40, cxS + sh, shY + 24)
      .C(cxS + sh - 18, shY - 6, cxS + nh + 20, nb - 4, cxS + nh + 3, nb - 16)
      .Z().d();
  }
  SM.figure.torsoPath = torsoPath;

  function softMark(paint, x, y, rx, ry, colour, opacity) {
    var fill = paint.radial(colour, colour, opacity);
    return '<ellipse cx="' + r(x) + '" cy="' + r(y) + '" rx="' + r(rx) + '" ry="' + r(ry) + '" fill="' + fill + '"/>';
  }
  SM.figure.softMark = softMark;

  /* Seen head-on a foot is heavily foreshortened: a short wedge
     from the ankle to the toes, turned a few degrees outward. */
  function foot(s, leg, sign, skin) {
    var x = leg.ankle.x + sign * 3, y = s.ankleY - 6, sole = s.soleY;
    var half = s.ankleHalf;
    /* Almost always hidden by a shoe, so this only needs to give
       the ankle something believable to sit on. */
    var d = P()
      .M(x - half, y)
      .C(x - half - 4, sole - 24, x - half - 4, sole - 3, x - half + 3, sole)
      .L(x + half + 12, sole)
      .C(x + half + 16, sole - 6, x + half + 4, y + 14, x + half, y)
      .Z().d();
    return '<path d="' + d + '" fill="' + skin + '"/>' +
      '<ellipse cx="' + r(x + half * 0.2) + '" cy="' + r(sole - 16) + '" rx="' + r(half * 1.1) +
      '" ry="10" fill="' + shade(skin, -0.14) + '" opacity=".45"/>';
  }

  /* A hand that reads at small sizes: palm mass, thumb, and two
     finger separations. More detail than that just turns to mud. */
  /* A relaxed hand: the palm mass narrows into fingers that taper
     and come to a rounded point, with the thumb tucked against the
     thigh. Anything more articulated turns to mud at feed size. */
  function hand(s, arm, sign, skin, paint) {
    var w = arm.wrist, h = arm.hand;
    var ww = s.forearmW - 2;
    var tip = h.y + 4;
    var palm = P()
      .M(w.x - ww, w.y - 4)
      .C(w.x - ww - 3, w.y + 24, h.x - ww - 1, h.y - 30, h.x - ww * 0.86, h.y - 12)
      .C(h.x - ww * 0.7, tip - 2, h.x + ww * 0.7, tip - 2, h.x + ww * 0.86, h.y - 12)
      .C(h.x + ww + 1, h.y - 30, w.x + ww + 3, w.y + 24, w.x + ww, w.y - 4)
      .Z().d();
    var thumbX = w.x - sign * (ww - 2);
    var thumbY = w.y + 26;

      '<g clip-path="url(#' + paint.clip(palm) + ')">' +
      '<path d="' + P().M(h.x - ww * 0.3, h.y - 34).L(h.x - ww * 0.34, h.y - 6).d() +
      '" stroke="' + shade(skin, -0.26) + '" stroke-opacity=".45" stroke-width="1.8" fill="none"/>' +
      '<path d="' + P().M(h.x + ww * 0.28, h.y - 34).L(h.x + ww * 0.32, h.y - 6).d() +
      '" stroke="' + shade(skin, -0.26) + '" stroke-opacity=".45" stroke-width="1.8" fill="none"/>' +
      '</g>' +
      '<ellipse cx="' + r(thumbX) + '" cy="' + r(thumbY) + '" rx="' + r(ww * 0.38) +
      '" ry="11" transform="rotate(' + (sign * 16) + ' ' + r(thumbX) + ' ' + r(thumbY) +

  }

  /* ============================================================
     Head, face, hair
     ============================================================ */
  SM.figure.hairBack = function (s, look, paint) {
    var colour = look.hairColour || '#2E1F16';
    var style = look.hairStyle || 'short';
    var cx = s.cx + s.shoulderOff, cy = s.headCy, rx = s.headRx, ry = s.headRy;
    var dark = shade(colour, -0.3);

    if (style === 'long') {
      return '<path d="' + P()
        .M(cx - rx - 3, cy - 10)
        .C(cx - rx - 14, cy + ry * 1.4, cx - rx - 20, s.shoulderY + 30, cx - rx - 10, s.shoulderY + 96)
        .L(cx - rx + 26, s.shoulderY + 100)
        .C(cx - rx + 16, s.shoulderY + 20, cx - rx + 8, cy + ry * 0.5, cx - rx + 6, cy)
        .L(cx + rx - 6, cy)
        .C(cx + rx - 8, cy + ry * 0.5, cx + rx - 16, s.shoulderY + 20, cx + rx - 26, s.shoulderY + 100)
        .L(cx + rx + 10, s.shoulderY + 96)
        .C(cx + rx + 20, s.shoulderY + 30, cx + rx + 14, cy + ry * 1.4, cx + rx + 3, cy - 10)
        .Z().d() + '" fill="' + paint.cylinder(dark) + '"/>';
    }
    if (style === 'curly') {
      var out = '';
      for (var i = 0; i < 16; i++) {
        var a = Math.PI * (0.92 + (i / 15) * 1.16);
        var px = cx + Math.cos(a) * (rx + 16);
        var py = cy + Math.sin(a) * (ry + 10) - 6;
        out += '<circle cx="' + r(px) + '" cy="' + r(py) + '" r="' + (17 + (i % 3) * 3) +
          '" fill="' + (i % 2 ? colour : dark) + '"/>';
      }
      return out;
    }
    if (style === 'bob') {
      return '<path d="' + P()
        .M(cx - rx - 4, cy - 8)
        .C(cx - rx - 12, cy + ry * 0.9, cx - rx - 6, cy + ry * 1.5, cx - rx + 4, cy + ry * 1.55)
        .L(cx + rx - 4, cy + ry * 1.55)
        .C(cx + rx + 6, cy + ry * 1.5, cx + rx + 12, cy + ry * 0.9, cx + rx + 4, cy - 8)
        .Z().d() + '" fill="' + paint.cylinder(dark) + '"/>';
    }
    if (style === 'bun') {
      return '<circle cx="' + r(cx) + '" cy="' + r(cy - ry - 16) + '" r="30" fill="' + paint.cylinder(dark) + '"/>';
    }
    return '';
  };

  SM.figure.head = function (s, look, paint) {
    var skin = look.skin || '#E3B48D';
    var cx = s.cx + s.shoulderOff;
    var cy = s.headCy, rx = s.headRx, ry = s.headRy;
    var out = '';

    /* Neck, sitting in the shadow the jaw casts. */
    out += '<path d="' + P()
      .M(cx - s.neckHalf, s.neckTop)
      .C(cx - s.neckHalf - 2, s.neckBase - 18, cx - s.neckHalf - 5, s.neckBase - 4, cx - s.neckHalf - 8, s.neckBase + 4)
      .L(cx + s.neckHalf + 8, s.neckBase + 4)
      .C(cx + s.neckHalf + 5, s.neckBase - 4, cx + s.neckHalf + 2, s.neckBase - 18, cx + s.neckHalf, s.neckTop)
      .Z().d() + '" fill="' + paint.cylinder(shade(skin, -0.2)) + '"/>';

    /* Ears before the skull so they tuck behind the jaw line. */
    [-1, 1].forEach(function (sign) {
      out += '<ellipse cx="' + r(cx + sign * (rx - 1)) + '" cy="' + r(cy + 6) +
        '" rx="9" ry="15" fill="' + shade(skin, -0.08) + '"/>';
    });

    /* Skull: an egg, wider at the cranium, tapering to the chin. */
    var skull = P()
      .M(cx - rx, cy - 6)
      .C(cx - rx, cy - ry - 6, cx + rx, cy - ry - 6, cx + rx, cy - 6)
      .C(cx + rx - 1, cy + ry * 0.42, cx + rx * 0.68, cy + ry * 0.86, cx, cy + ry)
      .C(cx - rx * 0.68, cy + ry * 0.86, cx - rx + 1, cy + ry * 0.42, cx - rx, cy - 6)
      .Z().d();
    out += '<path d="' + skull + '" fill="' + paint.cylinder(skin) + '"/>';

    /* Planes of the face: temple, cheekbone, jaw shadow. */
    out += softMark(paint, cx + rx * 0.55, cy + 4, rx * 0.5, ry * 0.55, cool(skin, -0.2), 0.55);
    out += softMark(paint, cx - rx * 0.42, cy + ry * 0.34, rx * 0.42, ry * 0.26, warm(skin, 0.14), 0.4);
    out += softMark(paint, cx, cy + ry * 0.9, rx * 0.6, ry * 0.18, shade(skin, -0.18), 0.5);

    out += face(s, look, paint, cx, cy, rx, ry, skin);
    return out;
  };

  /* The face is deliberately restrained: eyes, brows, a nose read
     purely as shadow, and lips. At feed size the head is roughly
     forty pixels tall, and anything more becomes noise. */
  function face(s, look, paint, cx, cy, rx, ry, skin) {
    var eyeY = cy + ry * 0.06;
    var eyeDX = rx * 0.42;
    var eyeW = rx * 0.30;
    var eyeH = eyeW * 0.52;
    var iris = look.eyeColour || '#4A3626';
    var lash = '#241A14';
    var out = '';

    [-1, 1].forEach(function (sign) {
      var ex = cx + sign * eyeDX;
      var socket = P()
        .M(ex - eyeW, eyeY)
        .C(ex - eyeW * 0.5, eyeY - eyeH * 1.5, ex + eyeW * 0.55, eyeY - eyeH * 1.35, ex + eyeW, eyeY - eyeH * 0.15)
        .C(ex + eyeW * 0.5, eyeY + eyeH * 1.2, ex - eyeW * 0.5, eyeY + eyeH * 1.25, ex - eyeW, eyeY)
        .Z().d();
      var clipId = paint.clip(socket);
      out += '<path d="' + socket + '" fill="#FBF6F0"/>';
      out += '<g clip-path="url(#' + clipId + ')">' +
        '<circle cx="' + r(ex + sign * 1) + '" cy="' + r(eyeY - eyeH * 0.1) + '" r="' + r(eyeH * 1.05) + '" fill="' + iris + '"/>' +
        '<circle cx="' + r(ex + sign * 1) + '" cy="' + r(eyeY - eyeH * 0.1) + '" r="' + r(eyeH * 0.48) + '" fill="#100C0A"/>' +
        '<circle cx="' + r(ex + sign * 1 - eyeW * 0.22) + '" cy="' + r(eyeY - eyeH * 0.6) + '" r="' + r(eyeH * 0.3) + '" fill="#fff" opacity=".9"/>' +
        '<ellipse cx="' + r(ex) + '" cy="' + r(eyeY - eyeH * 1.5) + '" rx="' + r(eyeW * 1.1) + '" ry="' + r(eyeH * 0.9) + '" fill="' + shade(skin, -0.3) + '" opacity=".55"/>' +
        '</g>';

        .M(ex - eyeW, eyeY - eyeH * 0.06)
        .C(ex - eyeW * 0.5, eyeY - eyeH * 1.5, ex + eyeW * 0.55, eyeY - eyeH * 1.35, ex + eyeW, eyeY - eyeH * 0.2).d() +
        '" fill="none" stroke="' + lash + '" stroke-width="' + r(eyeH * 0.42) + '" stroke-linecap="round"/>';

        .M(ex - eyeW * 1.15, eyeY - eyeH * 2.9)
        .Q(ex + sign * eyeW * 0.1, eyeY - eyeH * 4.0, ex + eyeW * 1.15, eyeY - eyeH * 2.4).d() +
        '" fill="none" stroke="' + mix(look.hairColour || '#2E1F16', skin, 0.25) +

    /* Nose: no outline, only the shadow down one side and the base. */

    out += '<path d="' + P()
      .M(cx + 2, eyeY + eyeH)
      .C(cx + rx * 0.16, noseY - ry * 0.14, cx + rx * 0.17, noseY - 4, cx + rx * 0.07, noseY).d() +

    out += '<ellipse cx="' + r(cx) + '" cy="' + r(noseY + 2) + '" rx="' + r(rx * 0.15) + '" ry="' + r(ry * 0.035) +
      '" fill="' + shade(skin, -0.3) + '" opacity=".5"/>';

    var lipW = rx * 0.30;

      .M(cx - lipW, lipY)
      .C(cx - lipW * 0.5, lipY - ry * 0.075, cx - lipW * 0.15, lipY - ry * 0.03, cx, lipY - ry * 0.012)
      .C(cx + lipW * 0.15, lipY - ry * 0.03, cx + lipW * 0.5, lipY - ry * 0.075, cx + lipW, lipY)
      .C(cx + lipW * 0.55, lipY + ry * 0.085, cx - lipW * 0.55, lipY + ry * 0.085, cx - lipW, lipY)
      .Z().d() + '" fill="' + lipColour + '"/>';
    out += '<path d="' + P().M(cx - lipW * 0.9, lipY).Q(cx, lipY + ry * 0.012, cx + lipW * 0.9, lipY).d() +
      '" fill="none" stroke="' + shade(lipColour, -0.45) + '" stroke-width="1.6" opacity=".7"/>';
    out += '<ellipse cx="' + r(cx - lipW * 0.25) + '" cy="' + r(lipY + ry * 0.04) + '" rx="' + r(lipW * 0.3) +

  }

  SM.figure.hairFront = function (s, look, paint) {
    var colour = look.hairColour || '#2E1F16';
    var style = look.hairStyle || 'short';

        .M(cx - rx - 1, cy - 4)
        .C(cx - rx - 1, cy - ry - 8, cx + rx + 1, cy - ry - 8, cx + rx + 1, cy - 4)
        .C(cx + rx * 0.7, cy - ry * 0.52, cx - rx * 0.7, cy - ry * 0.52, cx - rx - 1, cy - 4)
        .Z().d() + '" fill="' + fill + '" opacity=".92"/>';

       couple of strand highlights so it isn't a solid slab. */

    out += '<path d="' + P()
      .M(cx - rx - 3, cy + 4)
      .C(cx - rx - 5, cy - ry - 14, cx + rx + 5, cy - ry - 14, cx + rx + 3, cy + 4)
      .C(cx + rx * 0.86, cy - ry * 0.30, cx + rx * 0.30, cy - ry * sweep, cx - rx * 0.10, cy - ry * 0.42)

      .M(cx - rx * 0.55, cy - ry * 0.72)

      .M(cx - rx * 0.72, cy - ry * 0.40)
      .Q(cx - rx * 0.3, cy - ry * 0.72, cx + rx * 0.2, cy - ry * 0.78).d() +
      '" fill="none" stroke="' + hi + '" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>';

    if (style === 'long' || style === 'bob') {

          .M(cx + sign * (rx - 4), cy - ry * 0.5)
          .C(cx + sign * (rx + 8), cy - 6, cx + sign * (rx + 6), cy + ry * 0.5, cx + sign * (rx - 2), cy + ry * 0.92).d() +

  /* ---------- ground shadow ------------------------------------ */
  SM.figure.groundShadow = function (s, paint) {
    var fill = paint.radial('#000000', '#000000', 0.5);
    return '<ellipse cx="' + r(s.cx + s.sway) + '" cy="' + r(s.soleY + 6) +
      '" rx="' + r(s.hipHalf + 78) + '" ry="20" fill="' + fill + '"/>';

<script>
/* ============================================================
   STYLE ME — garment.js

   Product shots. Each garment is drawn the way a retailer
   photographs one: filled out as if worn but with no body inside,
   lit from the upper left, dropped on a light ground.

   Construction is what sells it — shoulder seams, topstitching,
   ribbed collars, plackets, pocket bags, sole units. A coloured
   silhouette reads as a sticker; the seams are what make it read
   as a thing you could pick up.
   ============================================================ */

window.SM = window.SM || {};

(function (SM) {
  'use strict';

  var C = SM.color;
  var P = SM.P;
  var shade = C.shade, mix = C.mix, warm = C.warm, lum = C.luminance;

  /* ---------- shared drawing helpers --------------------------- */

  /* A soft crease. Three stacked strokes fake a blur without
     paying for a filter on every repaint. */
  function fold(d, dark, w, strength) {
    var s = strength === undefined ? 1 : strength;
    return '<path d="' + d + '" fill="none" stroke="' + dark + '" stroke-opacity="' + (0.07 * s) +
      '" stroke-width="' + (w * 3.2) + '" stroke-linecap="round"/>' +
      '<path d="' + d + '" fill="none" stroke="' + dark + '" stroke-opacity="' + (0.10 * s) +
      '" stroke-width="' + (w * 1.7) + '" stroke-linecap="round"/>' +
      '<path d="' + d + '" fill="none" stroke="' + dark + '" stroke-opacity="' + (0.13 * s) +
      '" stroke-width="' + w + '" stroke-linecap="round"/>';
  }

  function highlight(d, light, w, opacity) {
    return '<path d="' + d + '" fill="none" stroke="' + light + '" stroke-opacity="' + (opacity || 0.35) +
      '" stroke-width="' + w + '" stroke-linecap="round"/>';
  }

  function stitch(d, colour, dash, width) {
    return '<path d="' + d + '" fill="none" stroke="' + colour + '" stroke-width="' + (width || 2.2) +
      '" stroke-dasharray="' + (dash || '7 6') + '" stroke-linecap="round" opacity=".9"/>';
  }

  function seamLine(d, colour) {
    return '<path d="' + d + '" fill="none" stroke="' + colour + '" stroke-width="1.8" opacity=".55"/>';
  }

  /* Contrast stitching on denim and workwear, tonal elsewhere. */
  function thread(item) {
    if (item.opts && item.opts.thread) return item.opts.thread;
    if (item.material === 'denim') return '#D9A24B';
    if (item.material === 'canvas') return '#E4D9BE';
    return lum(item.colour) > 0.5 ? shade(item.colour, -0.4) : shade(item.colour, 0.35);
  }

  function edgeColour(item) {
    return lum(item.colour) > 0.45 ? shade(item.colour, -0.42) : shade(item.colour, -0.55);
  }

  /* One piece of cloth: colour ramp, woven texture, edge. */
  function cloth(g, d, opt) {
    opt = opt || {};
    var colour = opt.colour || g.item.colour;
    var fill = opt.flat ? colour : g.paint.cylinder(colour, { gloss: opt.gloss });
    return '<path d="' + d + '" fill="' + fill + '"/>' +
      SM.materials.overlay(d, opt.material || g.item.material, opt.texture === undefined ? 1 : opt.texture) +
      '<path d="' + d + '" fill="none" stroke="' + (opt.edge || edgeColour(g.item)) +
      '" stroke-opacity="' + (opt.edgeOpacity || 0.7) + '" stroke-width="' + (opt.edgeWidth || 1.6) +
      '" stroke-linejoin="round"/>';
  }

  /* Ribbed knit band — collars, cuffs, hems. */
  function ribBand(g, d, colour) {
    var c = colour || shade(g.item.colour, -0.08);
    return '<path d="' + d + '" fill="' + g.paint.cylinder(c) + '"/>' +
      SM.materials.overlay(d, 'rib', 1) +
      '<path d="' + d + '" fill="none" stroke="' + edgeColour(g.item) + '" stroke-opacity=".6" stroke-width="1.4"/>';
  }

  function button(x, y, r, colour) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + colour +
      '" stroke="' + shade(colour, -0.45) + '" stroke-width="1"/>' +
      '<circle cx="' + (x - r * 0.3) + '" cy="' + (y - r * 0.2) + '" r="' + (r * 0.13) + '" fill="' + shade(colour, -0.5) + '"/>' +
      '<circle cx="' + (x + r * 0.3) + '" cy="' + (y - r * 0.2) + '" r="' + (r * 0.13) + '" fill="' + shade(colour, -0.5) + '"/>';
  }

  function metalRivet(x, y, r) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#B9A88C"/>' +
      '<circle cx="' + (x - r * 0.25) + '" cy="' + (y - r * 0.25) + '" r="' + (r * 0.4) + '" fill="#E9E0CC"/>';
  }

  function zipper(x, y1, y2, tone) {
    var teeth = '';
    for (var y = y1 + 4; y < y2; y += 9) {
      teeth += '<rect x="' + (x - 3.4) + '" y="' + y + '" width="6.8" height="4.4" rx="1.4" fill="' + tone + '"/>';
    }
    return '<rect x="' + (x - 6) + '" y="' + y1 + '" width="12" height="' + (y2 - y1) +
      '" rx="3" fill="' + shade(tone, -0.55) + '" opacity=".8"/>' + teeth +
      '<rect x="' + (x - 5) + '" y="' + (y1 + 6) + '" width="10" height="18" rx="4" fill="' + shade(tone, 0.25) + '"/>' +
      '<rect x="' + (x - 2.4) + '" y="' + (y1 + 20) + '" width="4.8" height="16" rx="2.4" fill="' + tone + '"/>';
  }

  /* Contact shadow so the garment sits on the ground. */
  function groundShadow(g, cx, cy, rx, ry) {
    var fill = g.paint.radial('#4A4236', '#4A4236', 0.34);
    return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + fill + '"/>';
  }

  /* The dark opening you see into a garment — neck, cuff, waist. */
  function inside(g, d) {
    return '<path d="' + d + '" fill="' + shade(g.item.colour, -0.62) + '"/>' +
      '<path d="' + d + '" fill="' + g.paint.radial('#000000', '#000000', 0.4) + '"/>';
  }

  /* ============================================================
     Tops
     ============================================================ */
  function topGeometry(o) {
    o = o || {};
    var chestHalf = o.chestHalf || 166;
    return {
      cx: 320,
      shoulderY: o.shoulderY || 104,
      shoulderHalf: o.shoulderHalf || 148,
      chestHalf: chestHalf,
      hemHalf: o.hemHalf || (chestHalf - 4),
      hemY: o.hemY || 556,
      neckHalf: o.neckHalf || 52,
      neckDrop: o.neckDrop || 34,
      chestY: o.chestY || 250
    };
  }

  function topBodyPath(t, o) {
    o = o || {};
    var cx = t.cx;
    var hemCurve = o.hemCurve === undefined ? 12 : o.hemCurve;
    var p = P()
      .M(cx - t.shoulderHalf, t.shoulderY)
      .C(cx - t.shoulderHalf - 6, t.shoulderY + 60, cx - t.chestHalf, t.chestY - 40, cx - t.chestHalf, t.chestY)
      .C(cx - t.chestHalf - 2, t.chestY + 90, cx - t.hemHalf, t.hemY - 120, cx - t.hemHalf, t.hemY - hemCurve)
      .C(cx - t.hemHalf * 0.5, t.hemY + hemCurve, cx + t.hemHalf * 0.5, t.hemY + hemCurve, cx + t.hemHalf, t.hemY - hemCurve)
      .C(cx + t.hemHalf, t.hemY - 120, cx + t.chestHalf + 2, t.chestY + 90, cx + t.chestHalf, t.chestY)
      .C(cx + t.chestHalf, t.chestY - 40, cx + t.shoulderHalf + 6, t.shoulderY + 60, cx + t.shoulderHalf, t.shoulderY);
    if (o.collar === 'v') {
      p.L(cx + t.neckHalf - 6, t.shoulderY + 6).L(cx, t.shoulderY + t.neckDrop + 40).L(cx - t.neckHalf + 6, t.shoulderY + 6);
    } else {
      p.C(cx + t.shoulderHalf - 40, t.shoulderY - 12, cx + t.neckHalf + 12, t.shoulderY + t.neckDrop - 16, cx + t.neckHalf, t.shoulderY + t.neckDrop)
       .C(cx + t.neckHalf * 0.55, t.shoulderY + t.neckDrop + 20, cx - t.neckHalf * 0.55, t.shoulderY + t.neckDrop + 20, cx - t.neckHalf, t.shoulderY + t.neckDrop)
       .C(cx - t.neckHalf - 12, t.shoulderY + t.neckDrop - 16, cx - t.shoulderHalf + 40, t.shoulderY - 12, cx - t.shoulderHalf, t.shoulderY);
    }
    return p.Z().d();
  }

  /* A sleeve leaves the shoulder, widens over the bicep and tapers
     to the cuff. The underarm seam has to run back to the armpit,
     not into the middle of the body — that was making sleeves look
     stuck on rather than sewn in. */
  function sleevePath(t, side, o) {
    o = o || {};
    var s = side;
    var cx = t.cx;
    var sx = cx + s * t.shoulderHalf;
    var armpitX = cx + s * (t.chestHalf - 4);
    var armpitY = (t.chestY || 250) - 10;
    var long = !!o.long;
    var cuffCx = sx + s * (long ? 88 : 52);
    var cuffY = long ? 496 : 292;
    var cuffW = long ? 30 : 44;
    var bicepOut = sx + s * (long ? 72 : 66);
    return P()
      .M(sx, t.shoulderY)
      .C(sx + s * 34, t.shoulderY + 14, bicepOut, t.shoulderY + 74, bicepOut + s * 4, t.shoulderY + 150)
      .C(cuffCx + s * (cuffW + 8), cuffY - 90, cuffCx + s * (cuffW + 4), cuffY - 30, cuffCx + s * cuffW, cuffY)
      .C(cuffCx + s * cuffW * 0.4, cuffY + 12, cuffCx - s * cuffW * 0.4, cuffY + 12, cuffCx - s * cuffW, cuffY - 6)
      .C(cuffCx - s * (cuffW + 6), cuffY - 90, armpitX + s * 16, armpitY + 90, armpitX, armpitY)
      .C(cx + s * (t.chestHalf + 2), armpitY - 52, cx + s * (t.shoulderHalf - 4), t.shoulderY + 46, sx, t.shoulderY)
      .Z().d();
  }

  function bodyFolds(g, t, hemY) {
    var dark = shade(g.item.colour, -0.5);
    var light = warm(g.item.colour, 0.4);
    var cx = t.cx;
    return fold(P().M(cx - t.chestHalf + 26, t.chestY - 40).C(cx - 70, t.chestY + 90, cx - 84, hemY - 150, cx - 62, hemY - 20).d(), dark, 9) +
      fold(P().M(cx + t.chestHalf - 30, t.chestY - 30).C(cx + 74, t.chestY + 100, cx + 88, hemY - 150, cx + 66, hemY - 20).d(), dark, 9) +
      fold(P().M(cx - 12, t.chestY + 60).C(cx - 22, hemY - 190, cx - 16, hemY - 110, cx - 24, hemY - 24).d(), dark, 6, 0.7) +
      highlight(P().M(cx - 96, t.chestY - 20).C(cx - 104, t.chestY + 120, cx - 100, hemY - 130, cx - 92, hemY - 40).d(), light, 22, 0.16);
  }

  /* ---------- tee / long sleeve -------------------------------- */
  function tee(g) {
    var o = g.item.opts || {};
    var t = topGeometry({
      shoulderHalf: o.boxy ? 162 : 146,
      chestHalf: o.boxy ? 178 : 164,
      hemY: o.cropped ? 500 : 580,
      neckDrop: 32
    });
    var th = thread(g.item);
    var cx = t.cx;
    var out = groundShadow(g, cx + 12, t.hemY + 40, t.hemHalf + 30, 26);

    if (!o.sleeveless) {
      out += cloth(g, sleevePath(t, -1, { long: o.long }));
      out += cloth(g, sleevePath(t, 1, { long: o.long }));

    var body = topBodyPath(t, { collar: o.collar });
    out += cloth(g, body);
    out += '<g clip-path="url(#' + g.paint.clip(body) + ')">' + bodyFolds(g, t, t.hemY) + '</g>';

    var nd = t.shoulderY + t.neckDrop;
    var neckOuter = P()
      .M(cx - t.neckHalf - 10, nd - 8)
      .C(cx - t.neckHalf, nd + 26, cx + t.neckHalf, nd + 26, cx + t.neckHalf + 10, nd - 8)
      .C(cx + t.neckHalf, nd + 4, cx - t.neckHalf, nd + 4, cx - t.neckHalf - 10, nd - 8)
      .Z().d();
    out += inside(g, neckOuter);
    out += ribBand(g, P()
      .M(cx - t.neckHalf - 12, nd - 12)
      .C(cx - t.neckHalf - 2, nd + 18, cx + t.neckHalf + 2, nd + 18, cx + t.neckHalf + 12, nd - 12)
      .C(cx + t.neckHalf + 4, nd - 24, cx - t.neckHalf - 4, nd - 24, cx - t.neckHalf - 12, nd - 12)
      .Z().d());

    out += stitch(P().M(cx - t.shoulderHalf + 6, t.shoulderY + 6).C(cx - 100, t.shoulderY + 4, cx - 70, t.shoulderY + 18, cx - t.neckHalf - 6, nd - 12).d(), th);
    out += stitch(P().M(cx + t.shoulderHalf - 6, t.shoulderY + 6).C(cx + 100, t.shoulderY + 4, cx + 70, t.shoulderY + 18, cx + t.neckHalf + 6, nd - 12).d(), th);
    out += stitch(P().M(cx - t.hemHalf + 6, t.hemY - 22).C(cx - 80, t.hemY - 6, cx + 80, t.hemY - 6, cx + t.hemHalf - 6, t.hemY - 22).d(), th);
    return out;
  }

  /* ---------- shirt -------------------------------------------- */
  function shirt(g) {
    var o = g.item.opts || {};
    var t = topGeometry({ shoulderHalf: 150, chestHalf: 168, hemY: 590, neckHalf: 48, neckDrop: 26 });
    var th = thread(g.item);
    var cx = t.cx;
    var nd = t.shoulderY + t.neckDrop;
    var out = groundShadow(g, cx + 12, t.hemY + 40, t.hemHalf + 30, 26);

    out += cloth(g, sleevePath(t, -1, { long: !o.short }));
    out += cloth(g, sleevePath(t, 1, { long: !o.short }));

    var body = topBodyPath(t, { hemCurve: 26 });
    out += cloth(g, body);
    out += '<g clip-path="url(#' + g.paint.clip(body) + ')">' + bodyFolds(g, t, t.hemY) + '</g>';

    var plackW = 20;
    var plack = P().M(cx - plackW, nd).L(cx + plackW, nd)
      .L(cx + plackW - 2, t.hemY - 6).L(cx - plackW + 2, t.hemY - 6).Z().d();
    out += cloth(g, plack, { colour: shade(g.item.colour, 0.05) });
    out += stitch(P().M(cx - plackW + 5, nd).L(cx - plackW + 6, t.hemY - 10).d(), th, '6 5', 1.8);
    out += stitch(P().M(cx + plackW - 5, nd).L(cx + plackW - 6, t.hemY - 10).d(), th, '6 5', 1.8);
    var btnColour = o.buttonColour || mix(g.item.colour, '#F3EFE6', 0.75);
    for (var i = 0; i < 6; i++) out += button(cx, nd + 46 + i * 84, 8.5, btnColour);

    var standD = P()
      .M(cx - t.neckHalf - 6, nd + 4)
      .C(cx - t.neckHalf, t.shoulderY + 4, cx + t.neckHalf, t.shoulderY + 4, cx + t.neckHalf + 6, nd + 4)
      .C(cx + t.neckHalf, nd + 20, cx - t.neckHalf, nd + 20, cx - t.neckHalf - 6, nd + 4)
      .Z().d();
    out += inside(g, standD);
    [-1, 1].forEach(function (side) {
      var leaf = P()
        .M(cx + side * (t.neckHalf + 6), nd - 2)
        .C(cx + side * (t.neckHalf + 34), nd + 8, cx + side * (t.neckHalf + 40), nd + 34, cx + side * 30, nd + 74)
        .L(cx + side * 6, nd + 12)
        .Z().d();
      out += cloth(g, leaf, { colour: shade(g.item.colour, 0.03) });
      out += stitch(P().M(cx + side * (t.neckHalf + 2), nd + 4)
        .C(cx + side * (t.neckHalf + 26), nd + 16, cx + side * (t.neckHalf + 30), nd + 34, cx + side * 32, nd + 68).d(), th, '5 4', 1.6);
    });

    if (o.pocket !== false) {

  /* ---------- knitwear ------------------------------------------ */
  function knit(g) {
    var o = g.item.opts || {};

    var cx = t.cx;
    var nd = t.shoulderY + t.neckDrop;
    var out = groundShadow(g, cx + 12, t.hemY + 42, t.hemHalf + 30, 26);

    out += cloth(g, sleevePath(t, -1, { long: true }));
    out += cloth(g, sleevePath(t, 1, { long: true }));
    out += ribBand(g, P().M(cx - 218, 452).L(cx - 152, 440).L(cx - 142, 494).L(cx - 210, 508).Z().d());
    out += ribBand(g, P().M(cx + 218, 452).L(cx + 152, 440).L(cx + 142, 494).L(cx + 210, 508).Z().d());

    var body = topBodyPath(t, {});
    out += cloth(g, body);
    out += '<g clip-path="url(#' + g.paint.clip(body) + ')">' + bodyFolds(g, t, t.hemY) + '</g>';

    if (o.cable) {
      var rope = shade(g.item.colour, -0.3), lift = warm(g.item.colour, 0.32);
      for (var k = -1; k <= 1; k += 2) {
        var bx = cx + k * 66, d = '';
        for (var y = t.chestY - 70; y < t.hemY - 40; y += 58) {
          d += 'M' + (bx - 22) + ' ' + y + 'C' + (bx + 24) + ' ' + (y + 18) + ' ' + (bx - 24) + ' ' + (y + 40) + ' ' + (bx + 22) + ' ' + (y + 58);
          d += 'M' + (bx + 22) + ' ' + y + 'C' + (bx - 24) + ' ' + (y + 18) + ' ' + (bx + 24) + ' ' + (y + 40) + ' ' + (bx - 22) + ' ' + (y + 58);
        }
        out += '<path d="' + d + '" fill="none" stroke="' + rope + '" stroke-opacity=".55" stroke-width="15" stroke-linecap="round"/>';
        out += '<path d="' + d + '" fill="none" stroke="' + lift + '" stroke-opacity=".5" stroke-width="7" stroke-linecap="round"/>';
      }
